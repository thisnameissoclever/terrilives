[workspace]
resolver = "2"
members = [
    "crates/terri-core",
    "crates/terri-data",
    "crates/terri-sim",
    "crates/terri-wasm",
]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
bevy_ecs = "0.18"
# `default-features = false` keeps `terri-core` free of a std-only serde
# and, more importantly, keeps the wasm32 dependency graph minimal; only
# the derive macros are needed for content-pack ids.
serde = { version = "1", default-features = false, features = ["derive"] }
# The content pipeline's two formats: `toml` is what a designer authors and
# `postcard` is what the build compiles it to. Both stay inside
# `terri-data`; neither reaches `terri-core`.
toml = "1"
# `default-features = false` for the same reason as serde above. postcard's
# default feature is `heapless-cas`, which drags in heapless, atomic-polyfill,
# spin, lock_api, scopeguard, hash32 and two embedded-io versions: nine crates
# of embedded scaffolding for a pack format that only ever needs `alloc`.
postcard = { version = "1", default-features = false, features = ["alloc"] }
wasm-bindgen = "0.2"
