# The starter lot: one open living space with a bathroom walled off in
# the north-east corner.
#
# Hand-authored on purpose, and this file is the precursor to build mode
# rather than a shortcut around it. Build mode later becomes an editor
# that writes exactly this format, so the FORMAT is the part worth
# getting right now; the layout is not, and is expected to be replaced by
# whatever the editor writes.
#
# Coordinates are tile indices with (0, 0) at the north-west corner.
# Placements are continuous rather than tile-snapped, because `Position`
# is an f32 pair and an object's tile is the tile its coordinates fall
# in - `x = 7.5` is legal and sits on tile 7.
#
# Walls list INTERIOR tiles only. The lot boundary is already solid,
# because `TileGrid::is_walkable` treats everything outside the grid as
# blocked, so authoring a perimeter here would be 80 redundant entries
# that no code would read differently.

width = 24
height = 18

wall = [
  # The bathroom's west wall, running north-south, with a doorway at
  # y = 5. The gap in this list IS the doorway; there is no separate
  # door concept yet.
  { x = 16, y = 0 },
  { x = 16, y = 1 },
  { x = 16, y = 2 },
  { x = 16, y = 3 },
  { x = 16, y = 4 },
  { x = 16, y = 6 },
  { x = 16, y = 7 },
  { x = 16, y = 8 },

  # Its south wall, running east from the corner above to the lot edge.
  { x = 17, y = 8 },
  { x = 18, y = 8 },
  { x = 19, y = 8 },
  { x = 20, y = 8 },
  { x = 21, y = 8 },
  { x = 22, y = 8 },
  { x = 23, y = 8 },
]

place = [
  # Kitchen, along the north wall of the living space. The sink is here
  # rather than in the bathroom deliberately: it gives the shower a
  # cheap, no-cost hygiene rival on the far side of the lot, which is
  # what turns "wash" into a decision rather than a threshold.
  { object = "fridge", x = 2.0, y = 2.0 },
  { object = "sink", x = 5.0, y = 2.0 },

  # Bathroom, reached through the doorway at (16, 5).
  { object = "shower", x = 18.0, y = 2.0 },
  { object = "toilet", x = 22.0, y = 2.0 },

  # Living space.
  { object = "bookshelf", x = 2.0, y = 10.0 },
  { object = "sofa", x = 7.0, y = 13.0 },
  { object = "television", x = 11.0, y = 15.0 },

  # Sleeping corner, south of the bathroom's south wall.
  { object = "bed", x = 20.0, y = 13.0 },
]
