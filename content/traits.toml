# Traits - the three mechanisms of [E3] in
# docs/specs/2026-08-01-m2e-satisfaction-hobbies-career-design.md.
#
# One file, three kinds, and the kinds are NOT interchangeable ([S4]):
# a disposition weighs a choice, a capability gates a completion as
# may-attempt-may-fail, and a condition acts on the satisfaction axis
# itself. The compile step rejects a trait declaring a number its kind
# does not read, so this file cannot quietly say something the
# simulation ignores.
#
# Every trait keys on an activity TAG - the same tag space hobbies use
# (objects.toml and social.toml declare them) - so one fear covers every
# couch-shaped route to lounging without naming each object.
#
# Labels are plain per the standing rule ([L58]); the voice pass happens
# WITH the owner in M2g. Per the design's framing note: a condition is
# managed and improvable, never a punchline.

# A disposition: Bill's pull toward the television, over and above what
# its need deltas earn it. 1.5x on the tagged candidates' scores -
# noticeable in the choice tables, not a compulsion. The mirror of a
# fear, which would sit below 1 (0 IS the fear, and is legal).
[[trait_def]]
id = "television_devotee"
label = "Television devotee"
description = "Loves watching television."
kind = "disposition"
tag = "television"
score_multiplier = 1.5

# A capability: cooking is a skill, and Casey does not have it yet. She
# MAY attempt - the stove is not hidden from her, because a sim who
# never approaches the stove is not a scene ([S4]) - and a failed
# attempt delivers nothing of the meal while still teaching her
# something. At 0.25 she fails three attempts in four to begin with;
# at 0.015 per attempt she is competent after ~35 real tries - a few
# sessions of genuine practice, not one. The first measured hour at
# 0.05 saw her MASTER the stove before dinner, which read as tutorial
# pacing rather than an arc; [A-13] records the correction.
[[trait_def]]
id = "cannot_cook"
label = "Can't cook"
description = "Ruins most meals at first, and gets better with every attempt."
kind = "capability"
tag = "cooking"
start_level = 0.25
fail_delta_scale = 0.0
learn_per_attempt = 0.015

# A condition: Tim's low spirits scale her satisfaction ACCRUAL - at
# full severity a completed hobby pays 40% of what it would - and the
# severity FALLS a little every time she does something tagged with the
# thing that helps, which for her is correspondence: the desk is where
# she talks herself back. Managed, improvable, never a joke ([S4]'s
# framing note). Starting severity 0.6: present, not crushing.
[[trait_def]]
id = "low_spirits"
label = "Low spirits"
description = "Gets less out of everything; attending to correspondence eases it."
kind = "condition"
tag = "correspondence"
accrual_scale = 0.4
# 0.005 per managed completion: the first hour at 0.02 resolved her
# completely before it ended. At the desk's measured ~30 sessions an
# hour this now eases about 0.15/hour - felt within a session, gone
# across several, which is the managed-not-cured shape [E3] wants.
manage_per_completion = 0.005
start_severity = 0.6

# ---------------------------------------------------------------------
# The library - [TL-library] in
# docs/specs/2026-09-21-trait-library-and-traits-panel.md.
#
# APPENDED, and the order below is fixed. A sim's `Traits` component
# stores pack trait indices, the world hash observes them, and a
# capability roll draws from the seeded generator in index order, so a
# trait inserted above would renumber state that already exists. New
# traits go at the END of this file.
#
# Every number in this file is pairwise distinct ([L26], [L29]): a
# multiplier pasted into a learning rate must change a test's answer.
# `the_trait_library_numbers_are_pairwise_distinct` enforces it.
#
# Adding a trait moves the save compatibility digest, which hashes every
# trait id with its kind. Read [TL-old-saves] before adding one: without
# a reviewed bridge the new build refuses every existing save.
# ---------------------------------------------------------------------

[[trait_def]]
id = "bookworm"
label = "Bookworm"
description = "Likes reading."
kind = "disposition"
tag = "reading"
score_multiplier = 1.35

[[trait_def]]
id = "keen_cyclist"
label = "Keen cyclist"
description = "Loves the exercise bike."
kind = "disposition"
tag = "exercise"
score_multiplier = 1.6

