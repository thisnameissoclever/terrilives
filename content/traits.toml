# [S4]'s own example, the fear of couches, at half strength: a sim who
# avoids the sofa still sits when comfort gets low enough.
[[trait_def]]
id = "couch_averse"
label = "Avoids the couch"
description = "Hates sofas and armchairs."
kind = "disposition"
tag = "lounging"
score_multiplier = 0.5

# A failed workout still delivers about half, which is different from a
# ruined meal delivering nothing. It does NOT end early: a fumble scales
# what an attempt delivers and never how long it takes, so the sentence
# must not promise a shorter session.
[[trait_def]]
id = "out_of_shape"
label = "Out of shape"
description = "Gets less from a workout at first, and gets fitter with every attempt."
kind = "capability"
tag = "exercise"
start_level = 0.42
fail_delta_scale = 0.52
learn_per_attempt = 0.02

[[trait_def]]
id = "slow_reader"
label = "Slow reader"
description = "Gets less from a book at first, and reads better with every attempt."
kind = "capability"
tag = "reading"
start_level = 0.58
fail_delta_scale = 0.3
learn_per_attempt = 0.012

# Two more conditions, framed as [S4] requires: managed and improvable,
# played straight. Each eases when the sim does the thing that helps.
#
# Named with care. A condition's label is also projected as a moodlet, so
# it must not repeat a need moodlet ("Lonely" is what a low social need
# already says), and "Restless" is this engine's own word for a sim that
# found nothing worth doing. `no_trait_label_repeats_a_need_moodlet` holds
# the first rule.
[[trait_def]]
id = "isolated"
label = "Isolated"
description = "Gets less out of everything; a chat eases it."
kind = "condition"
tag = "socialising"
accrual_scale = 0.7
manage_per_completion = 0.004
start_severity = 0.48

[[trait_def]]
id = "cooped_up"
label = "Cooped up"
description = "Gets less out of everything; exercise eases it."
kind = "condition"
tag = "exercise"
accrual_scale = 0.75
manage_per_completion = 0.008
start_severity = 0.44
