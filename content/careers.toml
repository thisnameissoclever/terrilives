# The jobs sims can hold - [E4] in
# docs/specs/2026-08-01-m2e-satisfaction-hobbies-career-design.md, on the
# career paths of docs/specs/2026-10-17-careers.md (issue 249).
#
# A career is a RABBIT HOLE: at shift_start (a tick of the day clock,
# `tick % day_ticks`) the working sim drops what it holds, walks to the
# doorway and is gone for shift_ticks. Return pays the sim's current pay
# into the household Funds, debits `energy_cost` from the worker, adds
# `satisfaction` to their life score, and scores the shift for the weekly
# review.
#
# A [[career]] is a PATH: what the work is like and the titled levels it
# climbs. `social_demand` (0 to 1) is how far the work faces other people;
# `skill` names the skill tag the work reads; `traits` gives each trait id
# a fit weight from -1 (the trait makes the work a misery) to 1 (made for
# it). A [[career.level]] is one job: its `id` is what a save names, its
# `title` what the player reads, `pay` what it pays per shift when taken
# and `pay_max` the most raises reach, in whole dollars. Pay climbs the
# levels: each level pays at least the one below and tops out higher, so
# a promotion always has a raise to give. `advance_weeks` is how many good
# weeks in a row a promotion out of the level needs.
#
# WAGES (issue 298, docs/specs/2026-10-18-wages-and-bills.md, [WB-wages]).
# Every pay and pay_max here is 1.5 times what it was before that issue,
# rounded half up to the dollar; saves from before it are migrated the same
# way when they load. A shift of the night kind pays tuning.toml's
# night_shift_premium_percent more, added to each night shift's pay when it
# starts; the numbers here stay without it. The household's bills
# (tuning.toml's [bills]) are calibrated against these wages.
#
# satisfaction is NON-NEGATIVE by build rule, and the number being small
# is the point: the job pays money, not meaning. What a bad job costs a
# life is the TIME it eats from hobbies and company - which the trace
# can measure - rather than a subtraction nobody can see the reason for.
# A job that actively drains a life is authored as a condition ([E4]'s
# recorded amendment); a job that suits a person badly costs them job
# satisfaction and, below the misery line, a little life satisfaction per
# shift (the careers spec, rule 10).
#
# Times are in ticks of the 1440-tick day (one tick is one sim-minute,
# so read them as minutes past midnight).
#
# working_days lists the weekdays the shift runs, by name from mon to
# sun: at least one, none twice - [CAL-careers] in
# docs/specs/2026-10-06-calendar.md. On any other day the worker stays
# home.
#
# SHIFTS (issue 296, docs/specs/2026-10-18-shifts-and-careers.md). A
# level's own shift_start, shift_ticks and working_days are its STANDARD
# shift, whose kind is the path's standard_shift: day, early, late or night
# (default day). A path may declare other shifts in [[career.shift]], each
# with an id unique within the path (never "standard"), a kind, a
# shift_start, a shift_ticks and working_days, checked as a level's are.
# A level's shift_weights gives each shift a whole-number weight from 0 to
# 1000, naming the level's own shift "standard"; no table means
# { standard = 1 }, and at least one weight must be above 0. A hire draws a
# shift by those weights. A weight of 0 is never drawn or offered but can
# still be held, so a save can name it: NEVER delete a shipped shift id;
# set its weight to 0 instead. The kind names the shift in the interface
# and moves the holder's sleep rhythm (tuning.toml's shift_sleep_offset_*).
#
# Titles are plain per [L58] and provisional: the owner reviews them
# before release. The labels and titles of the hospital, warehouse,
# library, restaurant kitchen and buses paths are owner-approved
# (2026-10-18).

[[career]]
id = "office"
label = "Office"
# Mostly paperwork; some people to talk to.
social_demand = 0.3
skill = "reading"
traits = { bookworm = 0.4, private_person = 0.2, chatterbox = -0.1, slow_reader = -0.2 }
# Almost always weekday days: the standard shift 19 times in 20.
standard_shift = "day"

[[career.shift]]
id = "late"
kind = "late"
# 12:00 to 20:00, Monday to Friday.
shift_start = 720
shift_ticks = 480
working_days = ["mon", "tue", "wed", "thu", "fri"]

[[career.level]]
# The level id the shipped worker's save names; it must keep this id.
id = "office_job"
title = "Office clerk"
# 06:00. Late enough that the player watches the household wake and
# scatter before anyone leaves; at 1x the first departure is 36 real
# seconds in.
shift_start = 360
# An eight-hour day, 06:00 to 14:00 - a third of the day gone, which is
# the whole antagonist. 48 real seconds absent at 1x, so a shift is
# watchable end to end.
shift_ticks = 480
# Funds per completed shift when the job is taken. The Buy tool spends it
# on the prices in objects.toml: one shift buys an armchair and a dining
# chair, and the dearest object, the pool, costs a little under seven
# shifts.
pay = 180
pay_max = 225
# Debited at return, on top of the ~24 points the energy decay rate
# takes across the shift itself: a workday costs about 40 energy all
# told, which the bed comfortably repays each night.
energy_cost = 15.0
# One completed shift is worth a third of one un-loved read (base 3).
# Deliberately nearly nothing - see the header.
satisfaction = 1.0
# Monday to Friday, so the household gets a weekend together.
working_days = ["mon", "tue", "wed", "thu", "fri"]
advance_weeks = 2
shift_weights = { standard = 19, late = 1 }

