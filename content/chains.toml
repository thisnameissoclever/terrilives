# The multi-step chains - [K1] in
# docs/specs/2026-08-01-m2f-multi-step-working-design.md.
#
# A chain is a sequence of steps across station ROLES (see the roles
# lists in objects.toml), advertised by one object and paid ONLY at the
# last step's completion - a sim that gets halfway through cooking and
# wanders off has not eaten. Steps resolve to the nearest placed object
# wearing the role at run time, so the chain works on any lot that can
# feed somebody, and refuses to compile on one that cannot.
#
# Durations are per STEP and obey the same clipped-duration rule as
# interactions. Tags ride per step: the hob step is what a cooking
# hobby loves and a cooking capability may fumble.

[[chain]]
id = "cook_dinner"
# Label plain per [L58]; the voice pass happens with Tim in M2g.
label = "Cook dinner"
advertised_by = "fridge"
# 70 hunger and 15 comfort, delivered WHOLE at the table. RETUNED
# from the first measurement rather than authored by taste: at the
# first cut (55 + 10) each sim cooked ONCE in 8.3 game days, because
# the whole-errand cost (~160 ticks of steps plus the legs) sits in
# the score's denominator and the snack out-earned it per tick even
# habituated. At 85 total the dinner loses to a FRESH snack when
# desperate - a quick bite is the honest desperate choice - and wins
# once habituation has worn the snack toward its 0.45 floor, which is
# exactly the rotation the retired stove interaction was tuned for.
advertises = { hunger = 70.0, comfort = 15.0 }
# Above the retired stove meal's 2.5: a cooked-and-eaten dinner is the
# fullest meal the game can express, and the satisfaction axis should
# say so.
satisfaction = 3.0

  [[chain.step]]
  role = "cold_storage"
  label = "Get ingredients"
  duration_ticks = 30
  yields = "ingredients"

  [[chain.step]]
  role = "prep_surface"
  label = "Prepare food"
  visual = { action = "prepare", anchor = "station", facing = "toward_anchor" }
  duration_ticks = 90

  [[chain.step]]
  role = "hob"
  # The step Bill's hobby loves and Casey's capability may fumble -
  # the cooking tag moved here from the stove's retired standalone
  # interaction (retirement lands in PR 2, when the chain runs).
  label = "Cook"
  visual = { action = "cook", anchor = "station", facing = "toward_anchor" }
  duration_ticks = 150
  tags = ["cooking"]
  transforms = { from = "ingredients", to = "dinner" }
  sound_action = "stove_cooking"

  [[chain.step]]
  role = "hob"
  label = "Simmer and stir"
  duration_ticks = 100
  visual = { action = "cook", anchor = "station", facing = "toward_anchor" }
  sound_action = "stove_cooking"

  [[chain.step]]
  role = "prep_surface"
  label = "Plate meal"
  duration_ticks = 40
  visual = { action = "prepare", anchor = "station", facing = "toward_anchor" }

  [[chain.step]]
  role = "meal_table"
  label = "Eat meal"
  duration_ticks = 90
  consumes = "dinner"
  visual = { action = "eat", anchor = "station", facing = "toward_anchor" }

# Internal chains keep the fridge's original snack command row stable.
[[chain]]
id = "prepare_snack"
label = "Grab a snack"
advertised_by = "fridge"
advertises = { hunger = 40.0 }
satisfaction = 0.0
  [[chain.step]]
  role = "cold_storage"
  label = "Get snack"
  duration_ticks = 20
  yields = "ingredients"
  [[chain.step]]
  role = "prep_surface"
  label = "Prepare snack"
  duration_ticks = 30
  transforms = { from = "ingredients", to = "dinner" }
  visual = { action = "prepare", anchor = "station", facing = "toward_anchor" }
  [[chain.step]]
  role = "prep_surface"
  label = "Eat snack"
  duration_ticks = 35
  consumes = "dinner"
  visual = { action = "eat", anchor = "station", facing = "toward_anchor" }

[[chain]]
id = "clean_dishes"
