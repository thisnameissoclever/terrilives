# The multi-step chains - [K1] in
# docs/specs/2026-08-01-m2f-multi-step-working-design.md.
#
# A chain is a shared procedure across station roles (see objects.toml).
# Public actions bind a recipe and retain their selected appliance through
# its designated step. Other stages choose an available station by role.
# Food arrives at the last step: halfway through cooking is not fed.
#
# These durations and benefits are internal defaults. Bound public actions
# supply resolved total work and need benefits; compilation allocates
# that work across the steps. Tags ride per step: the hob step is what a cooking
# hobby loves and a cooking capability may fumble.

[[chain]]
id = "cook_dinner"
# Label plain per [L58]; the voice pass happens with Tim in M2g.
label = "Cook dinner"
advertised_by = "fridge"
# Food pays at completion; chair Comfort and liked-company Social require actual use.
# Public actions set total work for these six stages. Cooked meals give
# more food than snacks and can supply invited hungry friends.
# Travel and gathering add time; urgency can make a snack the better choice.
# Repetition affects appeal, without changing the delivered need benefits.
advertises = { hunger = 70.0, social = 11.0 }
# Above the retired stove meal's 2.5: a cooked-and-eaten dinner is the
# fullest meal the game can express, and the satisfaction axis should
# say so.
satisfaction = 3.0

  [[chain.step]]
  role = "cold_storage"
  activity = "getting_ingredients"
  label = "Get ingredients"
  duration_ticks = 30
  yields = "ingredients"

  [[chain.step]]
  role = "prep_surface"
  activity = "preparing_food"
  label = "Prepare food"
  visual = { action = "prepare", anchor = "station", facing = "toward_anchor" }
  duration_ticks = 90

  [[chain.step]]
  role = "hob"
  activity = "cooking"
  # The step Bill's hobby loves and Casey's capability may fumble -
  # the cooking tag moved here from the stove's retired standalone
  # interaction (retirement lands in PR 2, when the chain runs).
  label = "Cook"
  visual = { action = "cook", anchor = "station", facing = "toward_anchor" }
  duration_ticks = 150
  tags = ["cooking"]
  transforms = { from = "ingredients", to = "dinner" }
  sound_action = "stove_cooking"

  [[chain.step]]
  role = "hob"
  activity = "cooking"
  label = "Simmer and stir"
  duration_ticks = 100
  visual = { action = "cook", anchor = "station", facing = "toward_anchor" }
  sound_action = "stove_cooking"

  [[chain.step]]
  role = "prep_surface"
  activity = "preparing_food"
  label = "Plate meal"
  duration_ticks = 40
  visual = { action = "prepare", anchor = "station", facing = "toward_anchor" }

  [[chain.step]]
  role = "meal_table"
  activity = "eating"
  label = "Eat meal"
  duration_ticks = 90
  consumes = "dinner"
  visual = { action = "eat", anchor = "station", facing = "toward_anchor" }

# Internal chains keep the fridge's original snack command row stable.
[[chain]]
id = "prepare_snack"
label = "Grab a snack"
advertised_by = "fridge"
advertises = { hunger = 40.0 }
satisfaction = 0.0
  [[chain.step]]
  role = "cold_storage"
  activity = "getting_ingredients"
  label = "Get snack"
  duration_ticks = 20
  yields = "ingredients"
  [[chain.step]]
  role = "prep_surface"
  activity = "preparing_food"
  label = "Prepare snack"
  duration_ticks = 30
  transforms = { from = "ingredients", to = "dinner" }
  visual = { action = "prepare", anchor = "station", facing = "toward_anchor" }
  [[chain.step]]
  role = "prep_surface"
  activity = "eating"
  label = "Eat snack"
  duration_ticks = 35
  consumes = "dinner"
  visual = { action = "eat", anchor = "station", facing = "toward_anchor" }

