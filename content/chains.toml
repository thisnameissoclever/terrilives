  visual = { action = "wash", anchor = "station", facing = "toward_anchor" }

[[chain]]
id = "eat_shared_meal"
label = "Join meal"
advertised_by = "fridge"
advertises = { hunger = 70.0, comfort = 15.0 }
satisfaction = 0.0
  [[chain.step]]
  role = "prep_surface"
  label = "Get prepared plate"
  duration_ticks = 25
  yields = "dinner"
  visual = { action = "prepare", anchor = "station", facing = "toward_anchor" }
  [[chain.step]]
  role = "meal_table"
  label = "Eat together"
  duration_ticks = 90
  consumes = "dinner"
  visual = { action = "eat", anchor = "station", facing = "toward_anchor" }
