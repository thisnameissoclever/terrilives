# Conversation topics: what a chat or a fight is about, as the player sees
# it. [RT-content] in docs/specs/2026-11-22-richer-topics.md. A topic's row is
# its place in this file. Saves keep a topic's `code` and `tag`, never a row,
# so every `code` below is frozen: it must equal the code a save already
# holds for the same tag. Tags that appear nowhere on an object are legacy
# aliases old saves still carry, and several tags share a bubble.
#
# kind    fields
# smalltalk, activity   code, tags (a tag may appear in one row only)
# fight                 code, reason (the fight reason tag)
# subject               bias, variation, sources, requires (see the spec)
#
# `icon` names a conversation bubble sprite; the web shell proves every name
# resolves. `label` is the word after "about" and in Likes and dislikes; an
# empty label means the topic names no subject.
#
# Order matters in one place. A random fight draws the first smalltalk or
# activity row in this file with its activity code, so
# `nothing-in-particular` (a random fight about nothing a person could name)
# comes before the other two rows that share code 7.

[[topic]]
id = "smalltalk"
kind = "smalltalk"
icon = "Talk"
code = 4
tags = ["smalltalk", "socialising"]

