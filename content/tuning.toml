
# Every knob that governs the SYSTEM lives here. Values describing a
# specific piece of content - a fridge's hunger delta - stay in
# objects.toml. This split is deliberate and permanent: a designer
# tuning feel should have one file to open, not a hunt through Rust
# constants.
#
# So: when you add a value somebody might want to change, it goes here
# rather than into a `const`. Ask which side it falls on - does it
# describe one thing, or does it govern how everything behaves? The
# first is content, the second is tuning. Existing scattered constants
# migrate here as they are touched; `action_threshold` below was the
# first, and the seven need decay rates at the bottom followed, out of
# needs.toml.
#
# Validated at build time like every other content file, so a missing or
# malformed knob fails cargo build rather than surfacing later as
# inexplicable behaviour.
#
# Three of these were retuned at the M1c alpha feel pass against a
# measured behaviour trace rather than by taste: choice_temperature,
# idle_threshold and min_interaction_ticks. The measurements, and the
# things the pass found that a knob CANNOT fix, are in
# docs/alpha-feel-notes.md. Every number quoted in the comments below
# came from that trace; replace them with new measurements rather than
# with new guesses.

# Below this score, an option is not worth doing at all.
action_threshold = 0.05

# Softmax temperature for choosing among candidates. Low approaches
# always-pick-the-best; high approaches pick-at-random.
#
# SCALE-SENSITIVE. Because urgency is cubed, scores span orders of
# magnitude, so this must be tuned against the real range rather than
# picked as a round number.
#
# The number that matters is not the score range but the GAP between the
# top two candidates, because softmax is exponential in the difference
# rather than in the ratio. Measured over 12 000 ticks of the shipped lot
# with one sim (docs/alpha-feel-notes.md): the gap is 0.0045 at the 10th
# percentile, 0.032 at the median and 0.142 at the 90th. Record new
# figures here when the content or the lot changes; the previous value
# was tuned against a guessed gap of 0.165, which is above the 90th
# percentile of what the game actually produces.
#
# What 0.06 buys at those gaps, stated for two candidates so the
# arithmetic is checkable: a median gap goes to the better option 63% of
# the time, a 10th-percentile gap is a 52/48 coin toss, and a
# 90th-percentile gap is 91/9. At the previous 0.15 the same three were
# 55%, 51% and 72% - which is to say the sim was choosing close to
# uniformly among everything it could see. One measured six-way decision
# at 0.15 spread from p 0.143 to p 0.191 across all six options, which
# is a coin toss with extra steps.
#
# Below roughly 0.005 the choice is effectively an argmax at these
# magnitudes; above roughly 0.5 it is effectively a coin toss.
choice_temperature = 0.06

# Below this, nothing is urgent enough to act on and the sim wanders
# instead of standing still. Separate from action_threshold on purpose:
# one asks "is anything worth doing", this asks "is nothing worth doing
# enough that I should mill about".
#
# The gap between the two knobs is a DEAD BAND in which the sim neither
# acts nor strolls, and it stands perfectly still for the whole of it.
# That band therefore has to be tuned against where the sim's best
# available score actually sits, not chosen for looking small.
#
# Measured over 12 000 ticks of the shipped lot: the best score visible
# to an unoccupied sim is 0.017 at the 5th percentile, 0.039 at the
# median and 0.050 at the 95th - so the whole operating range lies
# between these two knobs, and at the previous 0.02 the band swallowed
# 91% of every tick on which the sim was free to choose. It stood
# motionless for 23% of the run, in stretches of up to 15.8 real
# seconds, and wandered on 1.3% of ticks: three strolls in ten minutes,
# all of them in the first minute. At 0.04 the band takes 44%, standing
# still falls to 8.9% with a worst stretch of 6.9 s, and wandering rises
# to 9.6%.
#
# Raising it further has little left to give, because a wander PAUSE is
# also standing still. Measured as a matched pair - same seed, same
# length, only this knob moved - going from 0.04 to 0.045 converts
# frozen time into paused time and takes the total motionless share from
# 16.8% to 14.7%, while closing the dead band from 44% to 18% of free
# ticks. That is two points of stillness in exchange for most of what
# this knob exists to express.
idle_threshold = 0.04

# Ticks a sim pauses between wanders.
wander_pause_ticks = 20

# How many random tiles a sim will try before giving up on wandering for
# this tick.
#
# A wander destination is drawn at random and then pathed to, and a tile
# that is walled off has no path, so a roll can fail. This is what makes
# the retry BOUNDED: a sim sealed into a room with nowhere to walk
# re-rolls this many times, stands still for the tick, and tries again on
# the next one. An unbounded retry would not fail - it would HANG, and a
# hang is a far weaker signal than a red test: it burns a CI job timeout
# instead of printing an assertion. See [L15].
#
# Raise it in a lot that is mostly wall, where a uniform roll lands on
# something reachable less often. It is here rather than in a Rust `const`
# for the reason the header gives: it governs how everything behaves
# rather than describing one piece of content.
wander_attempts = 8

# The furthest an idle wander may travel, measured in path tiles. The
# destination also has to be within this Manhattan distance of the sim's
# starting tile, so a geometrically nearby tile behind a wall cannot turn a
# quiet drift into a trip around the house. Three tiles is enough to read as
# movement without making an idle sim look as though it has somewhere urgent
# to be. Must be at least 1; zero would reject every non-empty path and leave
# every contented sim standing still. The compile step also caps this at
# 2,147,483,647 so the `2 * radius + 1` sampling diameter fits a 32-bit
# WebAssembly `usize` and the simulation RNG's `u32` range.
#
# The shipped 12,000-tick trace observed 154 natural strolls: mean 2.26
# tiles, p95 3, and max 3. Against current main, walking fell from 34.0%
# to 29.9%, pause between strolls rose from 12.9% to 18.1%, and frozen
# time stayed effectively zero. The overall comparison is observational,
# not a matched pair, because drawing local offsets deliberately changes
# the deterministic random sequence. The direct locality claim is exact:
# every observed path stayed at or below this cap.
wander_radius_tiles = 3

# An interaction's content duration_ticks is a CENTRE. The real duration
# is sampled within this fraction either side, biased shorter, so
# repeated actions are not metronomic.
duration_variance = 0.4

# Hard floor on any interaction, in ticks. At 1x speed the simulation
# runs 10 ticks per second, so 12 ticks is 1.2 real seconds. Anything
# shorter reads as a sim teleporting through an action.
#
# THE FLOOR AND THE SHORTEST CONTENT DURATIONS FIGHT EACH OTHER, and the
# condition is arithmetic rather than a matter of taste. The sampled
# length spans `duration_ticks * (1 - duration_variance)` upward, so the
# floor is inert only where
#
#     duration_ticks >= min_interaction_ticks / (1 - duration_variance)
#
# which at these values is 20 ticks. Every interaction below that line
# has part of its band clipped, and one whose whole band is below the
# floor has a FIXED length: the variance does nothing, and the
# interaction also delivers floor/duration_ticks times what its content
# declares, because the refill rate is per content tick.
#
# That is not hypothetical. At the previous 25 the fridge (15), toilet
# (12) and sink (8) all had their entire bands under the floor, so 31 of
# 51 measured interactions - 61% - ran for exactly 25 ticks every single
# time, and the fridge delivered 67 hunger instead of the 40 it
# advertises.
#
# **THIS IS NOW A BUILD RULE RATHER THAN A WARNING.** `ClippedDuration` in
# crates/terri-data/src/compile.rs fails `cargo build` for any interaction
# whose band bottoms out below this value, so lowering the floor is safe and
# RAISING it is what needs care: raise it past 20 and every shipped object
# whose duration is under `new_floor / 0.6` stops compiling, which is the
# intended outcome rather than an obstacle - it forces the content decision
# instead of silently overriding it.
#
# The three offenders were fixed in content rather than here, because the
# floor was acting as a balance lever: the sink went from 8 ticks to 21 (and
# its hygiene delta from 22 to 32, without which raising the duration alone
# dropped it from 6 interactions to 1), the toilet from 12 to 24 and the
# fridge from 15 to 30.
#
# Measured over 12 000 ticks against the CURRENT content, after the decay
# retune below - every object shows real spread and none is pinned:
#
#   fridge 18-41 (declares 30)    toilet 14-32 (declares 24)
#   sink   13-24 (declares 21)    shower 27-53 (declares 45)
#   sofa   31-50                  television 33-72   bed 108-218
#
# These replace an earlier set taken before the adjacency and decay changes,
# which a review caught as stale. [L40]'s rule is that a re-measurement which
# disagrees means re-deriving rather than defending, so: reproduce with
# `cargo run -p terri-sim --example trace -- 12000`, and replace these numbers
# rather than arguing with them.
#
# **ONE JUSTIFICATION HERE NO LONGER HOLDS, and it is recorded rather than
# quietly fixed.** The sink's delta was raised to 32 on the argument that it
# would then score within about 2% of the shower, so which one a sim picks
# would turn on how tired it is. That was measured before the decay rates were
# slowed. It is now **3 sink uses against 9 shower uses** in 12 000 ticks, and
# the sink's share of all interactions fell from 11.8% before the pass to 3.2%
# after. The sink is closer to the bookshelf's zero than to a real choice.
#
# Do NOT chase it with a third delta change. Two objects are now near-unused
# for the same reason - nothing in the game makes repetition less attractive -
# and that is what habituation is for; see
# docs/specs/2026-07-29-satisfaction-and-traits-design.md. Raising numbers until
# an object wins on merit it does not have is the fix that was already rejected
# for the bookshelf in [C6].
min_interaction_ticks = 12

# How much of its score an object somebody else is using keeps.
#
# [C3] made a contested object visible to a sim again, so that being
# beaten to something stopped being reported as "nothing here is worth
# wanting". This knob decides what the sim does about it, and it does
# exactly one thing: it sets HOW BADLY A SIM MUST WANT A CONTESTED OBJECT
# BEFORE IT WILL STAND AND WAIT rather than stroll off. It never changes
# what a sim DOES, because a contested object is never a candidate at any
# value of this - only whether the sim stands still.
#
# A sim waits when `contested_score * this > idle_threshold`, so the raw
# score at which waiting begins is `idle_threshold / this`. At 0.04 and
# 0.75 that is 0.053, just above action_threshold, which is the design
# stance in one line: ANYTHING A SIM WOULD HAVE ACTED ON, IT WILL WAIT
# FOR. The band in which it wants a contested object and abandons it
# anyway is only 0.04 to 0.053.
#
# **THIS NUMBER IS A PRIORI AND UNMEASURED**, unlike the knobs the M1c
# feel pass tuned, and it is the only one in this file that is. No trace
# can produce it yet: the knob has no effect below two sims and the
# shipped page spawns one. What is behind it is arithmetic against
# measured quantities. From docs/alpha-feel-notes.md [F3] the shipped
# lot's decisions span scores of 0.059 to 0.276; from [F4] the best
# AVAILABLE score is clipped from above at action_threshold, because a
# sim acts the instant anything crosses it - but a contested object's
# score is NOT clipped that way and keeps climbing while the sim waits.
# So a 0.053 bar sits inside the real range rather than above it.
#
# **Before this knob existed the behaviour was this value pinned at 1.0**,
# so every outbid sim waited however little it wanted the thing. The cost
# of a value near the top is that it largely keeps the standing-still
# problem [F4] was written about. What bounds it is content: eight objects
# on the shipped lot means a blocked sim usually has something else above
# action_threshold and acts instead. The freeze needs EVERY alternative to
# be below the bar, which is why the eight-agent one-object reference
# scenario in crates/terri-sim/src/lib.rs is its worst case.
#
# Replace this with a measurement rather than another guess. The trace
# that settles it is the [O1] harness against a lot with two or more sims,
# reporting the distribution of contested scores and the share of ticks
# spent waiting.
contested_score_multiplier = 0.75

# HABITUATION - [S2]. Doing the same thing repeatedly makes it worth less.
#
# The psychological term for a diminished response to a repeated stimulus, and
# it applies identically to the same meal, the same television, the same gym and
# the same person. It is what the two near-unused objects were waiting for: the
# bookshelf at 0 uses in 12 000 ticks and the sink at 3, both squeezed out by an
# object that never got less appealing however often it was chosen.
#
# The multiplier applied to an interaction's benefit is
#
#     1 - habituation * (1 - habituation_floor)
#
# so a fresh interaction is worth 1.0 of its advertised delta and a fully
# habituated one is worth `habituation_floor`.
#
# **It scales the BENEFIT only, never a cost.** An interaction's negative deltas
# are left alone, and that asymmetry is deliberate rather than an oversight: a
# fourth shower in a row is less refreshing but it does not become less tiring.
# Scaling costs too would make a habituated shower cheaper and therefore MORE
# attractive, which is the mechanic running backwards.
#
# Raised on completion rather than per tick, so a long interaction and a short
# one habituate equally - the sim is tired of the ACTIVITY, not of the minutes.
habituation_per_use = 0.34

# How much every entry decays per tick. Must be strictly positive: at zero,
# habituation is a one-way ratchet and after long enough the whole house is
# equally unappealing, which is [C6] applied to everything at once and arrives
# silently over tens of minutes.
#
# **THE TIMESCALE HAS TO EXCEED THE GAP BETWEEN USES, and the first value here
# did not.** 0.0011 recovers a fully habituated interaction in 909 ticks. Over a
# 12 000-tick trace a sim revisits even its favourite object only about every 550
# ticks, and its television every 857 - so habituation had always decayed back to
# roughly zero by the next decision, and the mechanic did nothing at all. The
# repeat-use rate did fall, because that measures BACK-TO-BACK use where the gap
# is short, which is exactly the one case a fast decay still covers.
#
# **AND SLOWING IT TOO FAR IS ALSO WRONG, which was measured rather than
# reasoned.** At 0.0002 every entry saturates - equilibrium habituation is
# roughly `per_use * uses_per_tick / decay`, which exceeds 1 for every object the
# sim actually uses - so all of them sit at the floor together, relative ordering
# returns to the un-habituated one, and back-to-back repeats went back up from
# 1.1% to 3.3%. A uniform penalty is not a penalty.
#
# So there is a band, and 0.0011 is inside it. What it buys is specifically
# "do not immediately do that again": habituation is high right after a use and
# gone by the next opportunity, which is the case back-to-back repetition lives
# in. Measured: repeats 3.2% before habituation, 1.1% after.
#
# Measure this against the trace's repeat rate AND its per-object counts, not by
# taste. The two disagree at both ends of the band, which is what makes them
# worth having.
habituation_decay_per_tick = 0.0011

# What a fully habituated interaction's benefit is multiplied by. A MULTIPLIER,
# so 1.0 disables the effect entirely and 0 is rejected at build time - it would
# make an interaction permanently worthless, which is a need becoming
# unsatisfiable by a dynamic route that the static
# `every_declared_need_can_be_satisfied_by_some_interaction` check cannot see.
#
# 0.45 leaves a thoroughly-repeated action worth just under half its advertised
# value: enough to make a sim reach for something else, not enough to make it
# refuse to eat.
habituation_floor = 0.45

# Seed for a new simulation's PRNG. Save V1 persists the complete live PRNG
# state, which is what makes continuation after Load replayable.
rng_seed = 20260728

# The most player-issued intents one sim may hold at once. A click that
# would exceed it is refused rather than queued.
#
# THIS IS A BOUND ON THE PLAYER, not on the simulation, and it is the only
# thing rate-limiting a click. `drain_commands` pushes one intent per
# `UseObject` command and nothing else trims the queue, so without a cap a
# JavaScript loop - or a player leaning on the mouse - grows one sim's
# queue without limit, and every entry in it is a stretch of time that sim
# is not choosing for itself.
#
# The number is a TIME budget rather than a count. Measured over the
# shipped lot (docs/alpha-feel-notes.md): an interaction runs 12 to 25
# ticks and the walk to it costs up to about 80 more on a 14x10 lot at
# 0.25 tiles a tick, so one queued intent is roughly 2 to 10 real seconds
# at 1x. Four is therefore up to about 40 seconds of directed work
# already promised before a fifth click is even considered, which is well
# past the point where a player can still remember what they asked for.
#
# **The overflow drops the NEWEST intent, not the oldest**, and that is a
# deliberate trade rather than the obvious one. Dropping the oldest would
# mean evicting the intent the sim is currently carrying out, which would
# have to release its target and its reservation from inside the drain and
# would make a click able to cancel an earlier click's work silently.
# Refusing the new one keeps every accepted instruction honoured. The cost
# is a hard planning ceiling: the fifth rapid click is refused and the shell
# reports that the person's order queue is full. It no longer disappears as
# an apparently accepted click. Raise this only if watched play says four
# remembered orders are too few.
#
# Zero is rejected at build time: a cap of zero is not "no queueing", it
# is a game where clicking an object never does anything.
max_queued_intents = 4

# The most commands the WASM boundary will hold between two drains. A
# command that would take the queue past this is refused, and
# `SimHandle.enqueue_command` returns false so the shell can see that it
# was.
#
# THIS IS THE BOUND ON THE QUEUE ITSELF, and it is a different failure
# from `max_queued_intents` above rather than a second copy of it. That
# one bounds what a single sim can be told to do, and it is only ever
# reached by a `UseObject` that resolved to a live agent. Everything
# else a player can send - every `Select`, every `SetSpeed`, every
# command naming an index that no longer exists - reaches this staging
# queue and never touches an intent queue at all. So without a bound
# here, a JavaScript loop enqueueing `Select(u32::MAX)` grows memory
# without limit while the simulation looks perfectly healthy.
#
# The number is a BURST budget rather than a rate. The queue drains
# completely on every tick, and at 1x the simulation runs 10 ticks a
# second, so a player clicking as fast as a human can never accumulates
# more than a handful. What makes the burst larger than that is PAUSE:
# at speed 0 the driver stops calling `tick`, nothing drains, and every
# command issued while paused waits. 64 is therefore roughly six
# seconds of continuous clicking at a rate no hand sustains, or a
# comfortable number of orders issued to a paused lot before unpausing -
# and it is still four orders of magnitude below anything that would
# cost a browser tab memory it noticed.
#
# **The overflow drops the NEWEST command**, matching
# `max_queued_intents` and for the same reason: every command already
# accepted was accepted in an order the player chose and a replay must
# reproduce, so evicting from the front would silently rewrite history
# that [D8]'s command log has already recorded.
#
# Zero is rejected at build time: a cap of zero is not "no queueing", it
# is a game that ignores every click, keypress and pause the player ever
# makes while looking entirely normal doing it.
max_queued_commands = 64

# How often the shell re-reads a selected sim's needs for the need bars,
# in real milliseconds.
#
# This is a DISPLAY rate, not a simulation rate, and it is the only knob
# here that is: nothing downstream of it can change what the simulation
# does, only how often the panel asks. It lives here anyway because it is
# a knob somebody tuning the game will want to turn, and the standing rule
# in this file's header is that such a knob has one home rather than being
# a `const` buried in TypeScript nobody opens.
#
# The number is matched to the TICK, not to the display. The simulation
# advances 10 times a second at 1x and the browser paints 60 or more times
# a second, so at 100 ms the panel reads once per tick and five in six
# frames cost nothing but a timestamp comparison. Reading every frame
# would return the same seven numbers six times over, and each read is a
# call across the WASM boundary that allocates a seven-float array.
#
# Both directions have a visible cost, which is why this is a knob rather
# than a constant. Far below 100 spends boundary calls for numbers that
# have not changed. Far above it makes the bars lag behind the sim's
# behaviour, and the whole point of the panel is that a decision can be
# read against the bars afterwards - bars a second stale describe a
# decision that has already been made.
#
# Zero is legal and means "read every frame". It is not rejected at build
# time because it does not fail quietly: it is merely wasteful, and the
# panel still shows the truth. Contrast `max_queued_commands` above, where
# zero is a game that silently ignores every click.
#
# AT SPEED 2 AND 3 THE SIMULATION OUTRUNS THIS, deliberately. Speed
# multiplies ticks per frame and leaves the tick duration alone ([D2]), so
# 3x runs 30 ticks a second while the panel still reads 10 times a second
# and shows every third tick's levels. That is a display decision, not a
# simulation one, and it is why this is measured in real milliseconds
# rather than in ticks.
need_bar_refresh_ms = 100

# THE RELATIONSHIP TRIO - [H5]/[H9]. The same shape as the habituation
# trio above, pointed at people instead of objects: a per-use rise, a
# per-tick decay, and a bounded multiplier. A relationship is one number
# per ordered pair of sims, clamped to -1..=1, where 0 is a stranger;
# A's feeling about B is stored separately from B's about A, so
# unrequited is a real state.

# How much one completed social interaction raises EACH participant's
# relationship toward the other. 0.15 means roughly seven conversations
# take two strangers to best friends, which at measured M2c social decay
# (a sim seeks company every 2 000-4 000 ticks) is an evening of game
# time rather than a lifetime or an instant. Zero disables the mechanic,
# like habituation_per_use.
relationship_gain_per_talk = 0.15

# How much every relationship drifts toward zero each tick - toward
# zero, not downward: a grudge fades on the same clock a friendship
# does. 0.00001 costs a full friendship about a third of its warmth
# over 36 000 unattended ticks (one long measured session), so
# maintenance matters at the pace sessions are actually played. Must be
# strictly positive, or a relationship is a one-way ratchet - the same
# rule habituation_decay_per_tick carries.
relationship_decay_per_tick = 0.00001

# How strongly the initiator's relationship toward the target scales a
# social advert's BENEFIT: the multiplier is 1 + relationship * scale.
# At 0.5 a best friend's conversation is worth 1.5x its authored delta
# and a nemesis's 0.5x - enough to make sims visibly prefer their
# friends without ever making a stranger worthless. Must be in [0, 1]:
# above 1, a bad enough relationship turns the advertised benefit
# NEGATIVE, a cost nobody authored ([S2]). Applied in scoring AND
# delivery through one function ([H8]), so a sim seeks exactly what the
# conversation will give it.
relationship_delta_scale = 0.5

# ============================================================================
# The satisfaction axis - M2e, [E1]/[E2] in
# docs/specs/2026-08-01-m2e-satisfaction-hobbies-career-design.md.
# Satisfaction is the SECOND axis: a per-sim accumulator the player
# watches, produced by hobbies and reduced by neglect, never derived
# from need levels ([S1]).

# What completing a LOVED activity's satisfaction is multiplied by. At
# 3.0, a hobby completion is worth triple a merely-pleasant one: a
# loved read pays 9 against its base 3, so a sim with idle time and a
# hobby visibly out-earns one with idle time alone - which is the whole
# claim of [S1], that idle time must be SPENT to convert. Must be at
# least 1 (below 1 inverts the mechanic; exactly 1 disables it).
hobby_multiplier = 3.0

# The need level below which a need is NEGLECTED and bleeds
# satisfaction. 15 is beneath every self-serve equilibrium the traces
# have measured (the household's needs cycle in the 30-90 band when
# objects exist to serve them), so an ordinarily functioning sim never
# touches it - the bleed is for genuine neglect, a need with no object,
# a sim trapped away from one, or a career eating the time a need
# wanted. In [0, 100]; 0 disables.
neglect_floor = 15.0

# The length of a day in ticks - [E4]. One tick is one sim-minute, so
# 1440 IS the day, read straight off the clock: `tick % day_ticks` is
# minutes past midnight, and careers.toml writes shift times in it.
# 2.4 real minutes at 1x. No calendar and no weekday until something
# needs one. Must be at least 1 - a zero-tick day divides by zero the
# first time a career asks the hour.
day_ticks = 1440

# Satisfaction lost PER NEGLECTED NEED per tick below the floor:
# 0.002/tick is 24 per simulated hour per crisis. Against a dedicated
# hobbyist's rough 100-200/hour accrual that is a bruise rather than a
# knockout for one neglected need, and a compounding indictment for
# three - each need below the floor bleeds separately, because three
# crises are worse than one. Non-negative; 0 disables.
neglect_bleed_per_tick = 0.002

# What every need's decay rate is multiplied by while a sim is AT WORK
# - [X2] in docs/specs/2026-08-01-alpha-acceptance-findings.md, and the
# fix for the worst thing the alpha acceptance pass found.
#
# MEASURED, not chosen by taste. Over 36 000 ticks (25 game days) of
# the shipped lot, Tim - the household's only worker - hit 0.0 on six
# of her seven needs, and her lowest need sat at or below 5 on every
# one of the 25 days: 27.3% of her life with hunger there, 19.2% with
# social, 18.8% with fun. Bill and Casey, who hold no job, spent ZERO
# ticks in crisis on anything. `decay_needs` drains every sim holding
# `Needs`, and a sim off the lot at work can reach nothing at all, so a
# 480-tick shift plus its commute cost her 33 hunger a day against a
# daily budget of 89 - a deficit she came home already carrying.
#
# 0.5 rather than a rounder number for a reason that is checkable: it
# returns about 15 hunger a day to a sim who was about 13 short. The
# office is a building with a toilet and a kettle in it - you are not
# resting there, but you are not in a void either.
#
# **This does not refund the career's price**, which is TIME - the
# hobbies not done, the condition not managed, the satisfaction not
# earned. [E4]'s antagonist is untouched and [A-14]'s measurement of it
# still stands; what changes is that the price stops being starvation.
#
# The COMMUTE is deliberately excluded: walking to your own front door
# is ordinary life, and a sim on the lot can already be served.
#
# In [0, 1]. Above 1 the office would drain faster than living does;
# below 0 a shift would refill needs and work would become the best
# place in the game to be. Exactly 1 restores the void the career
# shipped with, which is how to measure this knob's effect again.
#
# A per-need table is the recorded follow-up rather than the shipped
# shape: social arguably should be SERVED at work rather than merely
# slowed, since colleagues are people - but that is a question about
# what a workplace IS, and it wants the per-career treatment a second
# job would force.
at_work_decay_scale = 0.5

# How fast needs decay while a sim is ASLEEP, as a fraction of the usual
# rate. The same knob shape as `at_work_decay_scale` above, for a problem
# with the same shape.
#
# Sleeping is the longest thing a sim does: the double bed runs 210 ticks
# against the fridge's 15. At the full decay rate those hours cost more
# hunger, hygiene and bladder than anything else in the game, so the sim
# that finally goes to bed wakes up starving and filthy, having been
# punished for doing the one thing the day was pushing it toward. That
# reads as the game being unfair rather than as a rate being wrong.
#
# 0.4 rather than 0. A sleeping sim genuinely does get hungry and does
# need the bathroom in the morning; it just does not get hungry as fast
# as one who is up and about. Zero would make the bed a place to hide
# from the simulation, and eight hours of nothing happening is the
# failure mode a needs game has to avoid most.
#
# **What counts as asleep is `sleep_tag` below**, not "is on a bed" and
# not "is gaining energy". A coffee machine would restore energy without
# being sleep, and the tag is what tells them apart.
#
# In [0, 1], validated exactly like the knob above. Exactly 1 restores the
# behaviour before this existed, which is how to measure it again.
asleep_decay_scale = 0.4

# The interaction tag that means SLEEPING.
#
# One tag, read by three separate things: the circadian drive that makes
# a bed attractive at night, the decay scale above, and the Zzz bubble
# the shell draws. It lives out here rather than inside `[circadian]`
# because that table is optional and currently commented out, and two of
# those three readers are not.
#
# It has to name a tag some interaction in `objects.toml` actually
# declares - the compile step checks, because a misspelling here is the
# quietest possible failure: no sim is ever asleep, and nothing says so.
sleep_tag = "sleep"

# Need decay per tick. One tick is one sim-minute, so 0.104 drains a full
# need in roughly 16 sim-hours.
#
# These are here rather than in needs.toml because a decay rate is system
# BALANCE, not part of a need's identity: needs.toml declares which needs
# exist, and this table says how fast the simulation drains them. That is
# the same split the header states, applied to the case that used to be
# the exception.
#
# Every NeedId variant that needs.toml declares must appear here exactly
# once. A missing or unknown entry fails the build.
#
# Changing a number here changes the simulation, and the world-hash golden
# vectors in crates/terri-sim/src/lib.rs and web/tests/bridge.test.ts will
# move - which is the intended signal, not a rebase artifact.
#
# The seven rates are deliberately all DIFFERENT, and that is load-bearing
# rather than flavour. `decay_needs` looks a rate up by need index, and a
# test cannot tell one slot from another if two slots hold the same value.
# `needs_decay_at_different_rates` in crates/terri-sim/src/systems/needs.rs
# fails if a balance pass ever makes two of them equal; see [L26] for the
# instance where a uniform fixture hid exactly this bug one layer down.
[decay_per_tick]
# ALL SEVEN WERE SLOWED at the alpha pass, and hunger by more than the rest.
#
# The old rates drained a need in 12 to 60 real minutes at 1x, which sounds
# leisurely and was not: the sim's whole day was eating and using the toilet,
# because those two drained fastest and everything else never got a turn. The
# measured share bears it out - fridge 28% and toilet 26% of all interactions
# between them, against 8% for the shower and 0% for the bookshelf.
#
# Every rate is multiplied by roughly 0.75, and hunger by 0.6 so it stops
# dominating. Hunger now takes 1 613 ticks to drain from full, which is 2.7
# real minutes at 1x and about 27 sim-hours.
#
# **All seven must stay DISTINCT.** `decay_needs` looks a rate up by need
# index, and no test can tell one slot from another if two slots hold the same
# value; `needs_decay_at_different_rates` fails if a balance pass ever makes
# two equal. See [L26] for the instance where a uniform fixture hid exactly
# that bug one layer down.
#
# **These are the BASE rates and they are about to stop being the whole
# story.** Three things are designed to modulate them and none is built:
# per-sim affinities so a social butterfly and an introvert drain `social` at
# different speeds, activity coupling so effort drains hunger faster than
# resting does, and a small seeded jitter so two sims are never metronomic
# together. See docs/specs/2026-07-29-needs-modulation-design.md; the shape
# those take is why this table is a table of base rates rather than the final
# numbers.
hunger = 0.062
energy = 0.051
# **0.072, raised from 0.039, for exactly the reason `fun` was raised.** The sink
# was used once in 12 000 ticks, and the candidate table shows why: hygiene sat at
# level 93, so its deficit was 0.07, and a cubed 0.07 makes the sink's only
# advertised need worth 0.0001. The shower alone delivers 840 points of hygiene
# per run against 468 drained - one shower covers about 1 800 ticks of drain, so
# a second hygiene object can never be needed.
#
# Raised here rather than by cutting the shower's 70, because "restores a lot and
# costs energy" is the shower's whole identity and the trade it exists to offer.
hygiene = 0.072
bladder = 0.102
social = 0.026
# **0.048, raised from 0.031, and this is the fix for [C6] that two earlier
# guesses missed.** The bookshelf was used ZERO times in every measurement ever
# taken, and both previous explanations were wrong: it was not its delta and it
# was not its 70-tick duration. The candidate table shows why - `fun` sat at
# level 98, so the bookshelf's only advertised need had a deficit of 0.02, and
# score is `delta * deficit^3`. Its score was exactly 0.0000. No delta and no
# duration can fix a zero.
#
# Fun was OVER-SUPPLIED. Three objects advertise it - television 30, bookshelf
# 26, sofa 18 - while it drained more slowly than all but two needs. Measured
# over 12 000 ticks: about 534 points delivered against 372 drained, a 43%
# surplus, and the two objects chosen for their OTHER needs (the television for
# social, the sofa for comfort) were quietly keeping fun topped up as a side
# effect.
#
# Raising the rate is the fix rather than stripping fun off the sofa, because the
# sofa genuinely is a fun object and the surplus is what was wrong.
fun = 0.048
# **0.032, raised from 0.021, and this is [C6] again in a different object.**
#
# The five-room house added five comfort objects - dining table 44, long sofa
# 52, armchair 38, reading chair 29, bathtub 47 - and the first trace over it
# had every single one of them at ZERO uses in 12 000 ticks. Same shape as the
# bookshelf, same reason, found the same way: the candidate table showed
# `comfort` sitting at level 87, so a deficit of 0.13, and score is
# `delta * deficit^3 / (distance / 0.25 + duration + 1)`. Cubed, that deficit
# is 0.0022. The armchair's 38 comfort - the best comfort-per-tick in the
# house - scored 0.0007 from across the lot and 0.0071 standing beside it,
# against an `action_threshold` of 0.05. No delta and no duration fixes a
# number an order of magnitude short at point-blank range.
#
# The distance matters to the diagnosis and is easy to drop: the same 0.0007
# still appears in the candidate table AFTER this fix, from nineteen tiles
# away, and reads as if nothing changed. What changed is the score standing
# next to the thing.
#
# Comfort was over-supplied and barely drained: 298 points delivered against
# 252 drained over 12 000 ticks, with a floor of 60.8, so it never got low
# enough to want. At 0.021 it was also the slowest-draining need in the file,
# 1.24 times slower than `social`'s 0.026 behind it.
#
# **Two changes together, and the other one matters more.** The double bed's
# comfort delta went from 27 to 10, because eight nights' sleep was supplying
# 216 of those 298 points - comfort was being kept topped up as a side effect
# of an action taken for a different need entirely, which is exactly what was
# wrong with `fun` above. This rate then went up by half so that comfort
# genuinely presses on a sim over a day rather than drifting.
#
# At 0.032 it is now the second slowest, behind `social`'s 0.026, and that is
# deliberate on both counts: comfort should be a background ache rather than
# an alarm, and social is meant to stay under-served until sims can satisfy
# each other.
comfort = 0.032

# ---------------------------------------------------------------------------
# THE CIRCADIAN RHYTHM IS BUILT AND SWITCHED OFF - [ML-curve], [ML-chrono].
# ---------------------------------------------------------------------------
#
# Every part of the mechanism ships: the schema, the compile-time
# validation, the curve and its tests in `systems/circadian.rs`, the
# per-sim chronotype offsets in personalities.toml, the `sleep` tags on
# both beds, and the multiplier composed into selection beside the trait
# dispositions. Uncommenting the block below is the only thing between
# here and sims that go to bed at night.
#
# It is off because the CURVE is not tuned, and turning it on with an
# untuned curve is exactly the failure this project has written down
# twice. [ML-feel] in the spec requires a measured seven-sim-day run
# before the shape is trusted, and the first draft proved why: at a
# 6.4x peak-to-trough swing the household slept so much that
# `save.rs`'s fixture could no longer get anyone to habituate to a
# kitchen chain row in 3 000 ticks, and needed 12 000 to see one. That
# is the drive overpowering the needs rather than weighting them.
#
# Softening it to 2.5x helped and did not settle it, and the honest
# reading is that the number wants a feel run rather than another guess.
# Widening the fixture instead is not available: `--timeout 60` bounds
# each mutant's whole workspace test run, and that one test alone went
# from 10 s to 39 s.
#
# So the mechanism lands reviewable and inert, and the tuning is a
# separate, measured piece of work. A milestone whose payoff has not
# been watched does not get quietly ticked.
#
# The circadian rhythm - [ML-curve] and [ML-tag] in
# docs/specs/2026-08-03-muted-line-implementation.md.
#
# WHY this exists at all: energy says how TIRED a sim is and nothing in it
# knows what time it is, so a bed looks identical at 14:00 and at 23:00 to
# a sim of the same tiredness. Without a drive, sims sleep whenever energy
# happens to bottom out, and over a few days that drifts through every
# hour of the clock - a house full of shift workers.
#
# The multiplier scales the BENEFIT of a sleep-tagged interaction, so it
# makes a bed more or less ATTRACTIVE rather than making anyone more or
# less tired. A sim who is exhausted at noon still goes to bed; a sim who
# is merely tired at 23:00 now does too, and that second one is the whole
# feature.
#
# `sleep_drive` is (tick, multiplier), interpolated linearly and wrapping
# from the last point back to the first. 60 ticks is a sim-hour, so 420 is
# 07:00 and 1320 is 22:00. The compile step rejects points that are
# unsorted, duplicated, outside the day, or negative - all four of which
# would interpolate to something plausible-looking and wrong rather than
# failing.
# The tag it keys on is `sleep_tag` up beside the decay knobs, not in
# here: this table is optional and the tag is not.
# [circadian]
#
# The peak-to-trough ratio is deliberately modest at 2.5x. The first
# draft ran 1.60 down to 0.25 - a 6.4x swing - and it was measurably too
# strong: the household spent so much of the day asleep that the save
# fixture in `save.rs` could no longer get anyone to habituate to a
# kitchen chain row inside 3 000 ticks, and needed 12 000 to see one.
# That is the drive overpowering the needs rather than weighting them.
#
# A rhythm is a THUMB ON THE SCALE, not a schedule. A sim who is
# exhausted at noon must still go to bed, and at 6.4x an early-morning
# sim would refuse one no matter how tired.
# sleep_drive = [
#   [0, 1.35],     # 00:00 - the middle of the night, bed is the obvious call
#   [300, 1.25],   # 05:00 - still night
#   [420, 0.55],   # 07:00 - morning: bed has to beat everything else going
#   [1020, 0.80],  # 17:00 - early evening, becoming reasonable again
#   [1320, 1.30],  # 22:00 - bedtime
# ]
