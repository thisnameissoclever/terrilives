# ---- Bedroom ---------------------------------------------------------------

[[object]]
id = "double_bed"
name = "The Restorative Unit"
sprite = "bedDouble"
footprint = { width = 2, depth = 2 }

  # **The only 2x2 object in the house**, and the one that most needed real
  # footprints to exist: a bed is genuinely a four-tile thing, and before [F1]
  # a sim standing "beside" one had 88% of its own sprite inside the bed's.
  #
  # 108 energy against the bunk's 100, over 210 ticks against its 180. The
  # bunk is therefore the better rate and this is the better night, which is
  # the same shape as the fridge-and-stove pair: the quick option wins until
  # habituation wears it down. 10 comfort on top, which the bunk does not
  # offer at all, so this is also what a sim picks when it is not especially
  # tired but wants to lie down.
  #
  # **10 and not the 27 this shipped with for one trace.** At 27, eight nights
  # of sleep supplied 216 of the 298 comfort points delivered in 12 000 ticks,
  # and comfort never fell below level 60.8 - so all five of the house's
  # comfort objects, the ones a player would actually recognise as somewhere to
  # sit, were at ZERO uses. Sleeping was quietly satisfying the need that the
  # armchair and the sofas exist for, which is the same mistake `fun` had made
  # through the television. See `comfort` in content/tuning.toml for the
  # measurement and the second half of the fix.
  #
  # 210 ticks is 21 seconds at 1x and the longest action in the game by a wide
  # margin. That is intentional - see the bunk's note on why sleep should be a
  # commitment rather than a top-up - and it is the single best demonstration
  # that the speed controls do something.
  [[object.interaction]]
  id = "sleep_properly"
  label = "Go to bed"
  advertises = { energy = 108.0, comfort = 10.0 }
  duration_ticks = 210
  slots = 2
  tags = ["sleep"]

