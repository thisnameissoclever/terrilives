# Smart objects. Each interaction advertises what it satisfies; agents
# score those adverts against their own deficits. Adding an object here
# is all it takes for agents to start using it.
#
# The numbers are a balance decision, not a port detail. Two properties
# the next person to rebalance should preserve:
#
# 1. No two durations and no two deltas are equal, and that is
#    load-bearing rather than flavour. `select_action` looks a delta up
#    by need index and an interaction up by position, and no test can
#    tell one slot from another if two slots hold the same value. See
#    [L26] and [L29] for the two recorded instances of exactly that bug.
# 2. A delta may be NEGATIVE, and one of them is: a shower costs energy.
#    Scoring weighs a cost by the cube of the deficit of the need it
#    drains, so an already-exhausted sim refuses a shower that a rested
#    one takes happily. See `score_advertisement`.
#
# `sprite` names an entry in assets/sprites/atlas.toml, and the build
# fails if it does not exist. It lives here rather than in the renderer
# on purpose: a lookup table in TypeScript would be a second copy of this
# list, so adding an object would be a two-file edit and giving one the
# wrong sprite would be a two-file bug. The names are Kenney's, kept
# verbatim so the provenance recorded in ASSETS.md stays checkable.

[[object]]
id = "fridge"
name = "Chill-o-Matic 3000"
sprite = "kitchenFridgeBuiltIn"

  # 40.0 was M0's hardcoded delta and is unchanged. The duration was 15,
  # also M0's, and it was raised to 30 in the alpha pass - see the block
  # comment at the top of this file for the arithmetic that forced it, and
  # `min_interaction_ticks` in content/tuning.toml for the rule.
  #
  # 30 ticks is 3 real seconds at 1x. A meal is the most-performed action in
  # the house - 28% of all interactions over a 12 000-tick trace - so it is
  # also the action a player watches most, and at the old 15 it sampled 12 to
  # 20 with a mean of 13.9, which is 1.4 seconds of a sim standing at a
  # fridge. Long enough to happen, too short to read as eating.
  #
  # The world-hash golden vectors in crates/terri-sim/src/lib.rs and
  # web/tests/bridge.test.ts are built on this object, so both numbers move
  # them.
  [[object.interaction]]
  id = "grab_snack"
  advertises = { hunger = 40.0 }
  duration_ticks = 30
  slots = 1

[[object]]
id = "bed"
name = "Sleepeazy Deluxe"
sprite = "bedBunk"

  # The largest single restore in the game and by far the longest, both
  # deliberately. Energy drains slowly (0.069 per tick), so sleeping
  # should be a rare whole-night commitment rather than a top-up squeezed
  # in between meals, and the long duration is what stops it winning on a
  # mild deficit.
  [[object.interaction]]
  id = "sleep"
  advertises = { energy = 100.0 }
  duration_ticks = 180
  slots = 1

[[object]]
id = "shower"
name = "Rainfall Cubicle"
sprite = "showerRound"

  # The trade-off object, and the reason negative deltas are allowed. It
  # restores a lot of hygiene and costs some energy, so a tired sim puts
  # it off - which is precisely the interaction this milestone exists to
  # make visible. Contrast the sink below: less hygiene, no cost, and a
  # fraction of the time.
  [[object.interaction]]
  id = "take_shower"
  advertises = { hygiene = 70.0, energy = -12.0 }
  duration_ticks = 45
  slots = 1

[[object]]
id = "toilet"
name = "Porcelain Standard"
sprite = "toiletSquare"

  # Cheap, fast and near-total. Bladder is the fastest-draining need
  # (0.139 per tick), so this has to be able to interrupt anything, and the
  # 95 delta is what achieves that without needing a special case.
  #
  # The duration was 12 - exactly `min_interaction_ticks` - and is now 24.
  # **The delta is what makes this interrupt things, not the duration**, so
  # doubling the length costs it less than it looks: at five tiles of travel
  # the score falls to 0.72 of its old value while still carrying the largest
  # delta in the house by 25 points. It remains the second-shortest action,
  # which is the "fast" this comment is about, and it is still comfortably
  # the most-chosen after the fridge.
  [[object.interaction]]
  id = "relieve_self"
  advertises = { bladder = 95.0 }
  duration_ticks = 24
  slots = 1

[[object]]
id = "television"
name = "Cathode Companion"
sprite = "cabinetTelevisionDoors"

  # Two slots, so it does not become contended when households grow past
  # one sim. More fun per tick than either the sofa or the bookshelf, and
  # no comfort at all, which is what the sofa trades against.
  #
  # THE `social` DELTA IS A PLACEHOLDER, and saying so here is the point.
  # `social` is meant to be satisfied by other sims, which is M2; until
  # then this is the one object in the house where a lone sim can plausibly
  # be kept company, and its two slots are also where two sims will watch
  # together.
  #
  # It exists because the alternative was worse. Until M1c's close-out no
  # object advertised `social` at all: it drained at 0.035 a tick, hit zero
  # at about tick 2 857 - 4.8 minutes at 1x - and stayed there for the rest
  # of the session, which would have shipped M1b's need bars with one bar
  # permanently empty and no action in the game able to fill it. Recorded
  # as [C2] in docs/alpha-feel-notes.md, and now a build-time rule:
  # `every_declared_need_can_be_satisfied_by_some_interaction` in
  # crates/terri-data/src/lib.rs fails if any declared need loses its last
  # positive advert.
  #
  # **24 IS MEASURED, AND THE OBVIOUS DIRECTION IS BACKWARDS.** Over 12 000
  # ticks of the shipped lot with the [O1] agent, matched pairs varying only
  # this number:
  #
  #   delta   social band        television's share of interactions
  #   none    0 from t=2857      6.6% (8 of 121)
  #   8       0 on 699 ticks     30.1% (44 of 146)
  #   14      21-52, floor 17    21.1% (28 of 133)
  #   24      33-69, floor 30    14.4% (18 of 125)
  #
  # A SMALLER delta makes the television MORE dominant, not less, which is
  # the opposite of what "keep the placeholder subtle" would suggest. The
  # reason is that urgency is CUBED: equilibrium sits where
  # `delta * deficit^3 / time_cost` matches what else the sim could be
  # doing, so halving the delta buys back only a cube root of deficit - the
  # sim holds social lower AND visits more often, because each visit
  # delivers less. Anybody tuning this should move it UP to make the
  # television less central.
  #
  # 24 is where every other need returns to roughly its no-advert level
  # (hygiene 79.0 against 79.2, bladder 72.6 against 75.7, 125 interactions
  # against 121) while social holds a live band instead of a floor. It is
  # still the lowest need in the house by 14 points, which is the intended
  # reading: a sim with only a television for company stays lonely, and M2
  # is what fixes that rather than a bigger number here.
  #
  # Not 22 or 26: rule 1 above, which requires exact uniqueness and those
  # are the sink's and the bookshelf's. Not 12 either, and that one is a
  # precaution BEYOND rule 1 rather than an application of it - 12 and the
  # shower's -12.0 are already distinct values, so rule 1 permits it. The
  # reason to avoid it anyway is the same reason rule 1 exists: a mutation
  # dropping a negation would collapse the two into one value, and no test
  # could then tell the slots apart.
  #
  # One thing this DID cost, recorded as [C6] in docs/alpha-feel-notes.md
  # rather than hidden here: the bookshelf goes from 3 interactions to zero
  # and stays there at every delta tried, including 8. It was already the
  # least-used object in the house.
  [[object.interaction]]
  id = "watch_tv"
  advertises = { social = 24.0, fun = 30.0 }
  duration_ticks = 55
  slots = 2

[[object]]
id = "sofa"
name = "Chesterfield Regret"
sprite = "loungeDesignSofaCorner"

  # Two advertised needs, deliberately. [D6]'s scoring SUMS across
  # advertised deltas, and this is the first object in shipped content
  # where that is observable in the running game rather than only in a
  # test: neither 18 fun nor 34 comfort would beat the television's 30
  # fun on its own, and together they can.
  [[object.interaction]]
  id = "lounge"
  advertises = { fun = 18.0, comfort = 34.0 }
  duration_ticks = 50
  slots = 2

[[object]]
id = "sink"
name = "Basin Basic"
sprite = "bathroomSinkSquare"

  # The quick partial fix for hygiene, and its whole reason for existing
  # is to give the shower something to lose to: a short action with no
  # energy cost against 45 ticks and a 12-energy cost. Which one wins
  # depends on how tired the sim is rather than on a threshold.
  #
  # **This was the worst-clipped interaction in the game and the reason the
  # alpha pass raised all three.** At 8 ticks its entire sampled band was
  # 4.8 to 11.2, which sits wholly below `min_interaction_ticks`, so every
  # single one of its interactions ran for exactly 12 ticks - measured, 6 of
  # 6 over 12 000 ticks, min and max both 12 - and it delivered 12/8 = 1.5x
  # its advertised hygiene, 33 rather than 22. `duration_variance` did
  # nothing at all for it.
  #
  # 21 is above the clipping line of 20 (`min_interaction_ticks / (1 -
  # duration_variance)`) with a tick of margin, so the floor is a safety net
  # again rather than the thing setting the length. It is still less than
  # half the shower's 45, which is the trade this object exists to offer.
  #
  # **THE DELTA WENT UP WITH THE DURATION, AND THAT IS NOT A COINCIDENCE -
  # 22 WOULD HAVE KILLED THIS OBJECT.** Raising the duration alone moved this
  # interaction's score denominator from `4*distance + 9` to
  # `4*distance + 22`, a factor of 0.69 at typical range, while its only
  # competitor - the shower - kept its 45 and lost nothing. Measured over
  # 12 000 ticks: sink usage fell from 6 interactions to **1**, which is
  # within a rounding error of the bookshelf's zero ([C6]). Fixing a duration
  # by making an object furniture is not a fix.
  #
  # 32 restores the ratio the duration change cost it: the two now score
  # within about 2% of each other at the observed mid-run need levels, so
  # which one a sim picks genuinely turns on how tired it is - which is the
  # sentence at the top of this comment, finally true rather than merely
  # intended. At the softmax temperature in content/tuning.toml a gap that
  # small is close to a coin toss, and that is the correct reading of "it
  # depends".
  #
  # 32 and not 33: rule 1 at the top of this file. 34 is the sofa's comfort
  # and 30 is the television's fun.
  [[object.interaction]]
  id = "wash_hands"
  advertises = { hygiene = 32.0 }
  duration_ticks = 21
  slots = 1

[[object]]
id = "bookshelf"
name = "Wall of Intent"
sprite = "bookcaseClosedDoors"

  # The slowest fun in the house. It is here as the low end of the fun
  # range, so the three fun objects span a real spread instead of
  # clustering and making the choice between them arbitrary.
  [[object.interaction]]
  id = "read"
  advertises = { fun = 26.0 }
  duration_ticks = 70
  slots = 1
