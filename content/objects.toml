# ---- Study -----------------------------------------------------------------

[[object]]
id = "desk"
name = "Station of Ongoing Concern"
sprite = "desk"
footprint = { width = 2, depth = 1 }
# A second eating surface, so meals do not funnel through one table
# tile - and eating at the desk is a life the game should be able to
# depict.
roles = ["eating_surface"]

  # **This is where the career goes**, and until it does, it is a hobby that
  # tires you out: 36 fun for 58 ticks, at a cost of 7 energy.
  #
  # The temptation was to make it a bad deal now on the grounds that work is a
  # bad deal, and that was rejected. An object nothing ever chooses is an
  # object nobody ever sees, and the house has one recorded instance of
  # exactly that already - the bookshelf spent 12 000 ticks at zero uses
  # ([C6]) because its arithmetic could not win, not because its idea was
  # wrong. 36 fun puts this above the bookshelf's 26 and below the
  # television's 30-plus-24, so it is a real third option in the fun rotation.
  #
  # The energy cost is what makes it recognisably work rather than recreation,
  # and it is the mechanism the wage will hang off: once there is a career,
  # the cost stays and the payoff moves from `fun` to money.
  [[object.interaction]]
  id = "attend_correspondence"
  label = "Work"
  advertises = { fun = 36.0, energy = -7.0 }
  duration_ticks = 58
  slots = 1
  # Tim's whole archetype is named after this desk. Base 3 like
  # reading: an absorbing, active hobby - and when PR 3's career lands,
  # the tag is what will let the job and the hobby be told apart.
  tags = ["correspondence"]
  satisfaction = 3.0

[[object]]
id = "desk_chair"
name = "Ergonomic, Allegedly"
sprite = "chairDesk"

  # No interactions, for the same reason as the dining chairs.

[[object]]
id = "reading_chair"
name = "The Wingback Sabbatical"
sprite = "loungeChairRelax"

  # 15 comfort and 16 fun. Both numbers are middling on purpose: this is the
  # object that wins when a sim is moderately short of two things at once, and
  # loses to anything that is the best answer to one of them.
  #
  # Placed in the study rather than the living room, so that "sit somewhere
  # comfortable" has an answer in a room a sim might otherwise never enter.
  #
  # **51 ticks, down from 66, and the margin was 0.0004.** At 66 this was at
  # zero uses over 12 000 ticks, and the candidate table caught it standing two
  # tiles from an idle sim scoring 0.0497 against an `action_threshold` of
  # 0.0500. Nothing was wrong with either delta; the duration is in the
  # denominator, and 66 put it a rounding error below the line. 51 scores
  # 0.062 from the same spot. Worth recording as a shape rather than as a
  # number: an object can be at zero uses and be four ten-thousandths away
  # from working.
  #
  # **46 ticks and fun 19, from 51 and 16, at M2d - the SAME cliff a
  # second time, and one lever was not enough to climb it.** Conversations
  # arrived, chat carries a 6-fun rider, and every talk a sim has is idle
  # time this chair used to be the answer to: the measured 12 000-tick run
  # had it back at zero. Trimming the duration alone (51 to 46) recovered
  # three uses over 36 000 ticks and still zero over 12 000, so the fun
  # delta moved too - 19 keeps it below the bookshelf's 26 and the
  # television's 30, so "middling" survives as a role even though the
  # number crept. The object sits a rounding error above the action
  # threshold BY DESIGN, so any new competitor for its needs will shave
  # this margin again; expect a rethink of "middling on purpose" when
  # M2e's hobbies land.
  [[object.interaction]]
  id = "settle_in"
  label = "Sit and read"
  advertises = { comfort = 15.0, fun = 19.0 }
  duration_ticks = 46
  slots = 1
  # The bookshelf read's twin - one hobby, two chairs' worth of routes,
  # which is also what keeps habituation from parking a reader on a
  # single object forever.
  tags = ["reading"]
  satisfaction = 3.0

[[object]]
id = "reference_shelf"
name = "Reference Section, Personal"
sprite = "bookcaseClosedWide"

  # **No interactions, and this one is a balance decision rather than a
  # category.** A second readable bookshelf would split the fun rotation three
  # ways and take use away from the object that has only just stopped being at
  # zero ([C6]). It is a bookshelf that is furniture, which is what most
  # bookshelves are.

# ---- Bathroom --------------------------------------------------------------

[[object]]
id = "bathtub"
name = "The Long Soak Directive"
sprite = "bathtub"
footprint = { width = 2, depth = 1 }

  # **The shower's opposite number.** 58 hygiene against the shower's 70, but
  # 31 comfort where the shower gives none, and 3 energy of cost against the
  # shower's 12.
  #
  # So: the shower is how you get clean when you need to be clean, and this is
  # how you get clean when what you actually want is to lie down. The shower
  # wins on hygiene alone and always will; this takes the decision only when
  # comfort is short as well, which is precisely the state a tired grubby sim
  # is in at the end of a day.
  #
  # The energy cost is small rather than absent because a very hot bath does
  # take something out of you, and because a cost of zero would make this
  # strictly better than the shower on every axis but speed.
  #
  # **78 ticks, down from 130, and no sane delta would have rescued the 130.**
  # At 130 this was at zero uses over 12 000 ticks, and the reason is
  # structural rather than a matter of taste: duration sits in the score's
  # denominator, so a 130-tick action needs about three times the delta of a
  # 45-tick one to compete, and its direct rival is the 45-tick shower. With
  # hygiene and comfort both at their measured floors it scored 0.15 against
  # the shower's 0.32, which at a temperature of 0.06 is a draw it loses about
  # nineteen times in twenty. A big enough delta could in principle have
  # closed a 1.7x gap; nothing that would still read as a bath could.
  #
  # 78 ticks is 7.8 seconds at 1x and still the third-longest action in the
  # house behind the two beds, so "long soak" survives the change. The comfort
  # delta then came down from 64 to 31 with the rest of them in [B6], so this
  # wins on hygiene-plus-comfort together and never on comfort alone.
  [[object.interaction]]
  id = "soak"
  label = "Take a bath"
  advertises = { hygiene = 58.0, comfort = 31.0, energy = -3.0 }
  duration_ticks = 78
  slots = 1

[[object]]
id = "laundry"
name = "Cycle, Perpetual"
sprite = "washerDryerStacked"

  # **No interactions, and this is the one that was hardest to leave alone.**
  # A chore that costs time and returns nothing is perfect for this game's
  # register, and it is unimplementable today for a boring reason: utility
  # scoring only ever chooses the best-scoring advert, so an interaction that
  # advertises nothing positive is an interaction no sim will ever pick. It
  # would be a joke told to an empty room.
  #
  # It becomes possible the moment there is a satisfaction axis to spend
  # against - see docs/specs/2026-07-29-satisfaction-and-traits-design.md,
  # where "neglected needs subtract" gives a chore something to prevent rather
  # than something to provide. The washer is placed now so that it is already
  # in the room when that lands.
