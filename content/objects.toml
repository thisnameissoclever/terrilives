# Smart objects. Each interaction advertises what it satisfies; agents
# score those adverts against their own deficits. Adding an object here
# is all it takes for agents to start using it.
#
# The numbers are a balance decision, not a port detail. Two properties
# the next person to rebalance should preserve:
#
# 1. No two durations and no two deltas are equal, and that is
#    load-bearing rather than flavour. `select_action` looks a delta up
#    by need index and an interaction up by position, and no test can
#    tell one slot from another if two slots hold the same value. See
#    [L26] and [L29] for the two recorded instances of exactly that bug.
# 2. A delta may be NEGATIVE, and one of them is: a shower costs energy.
#    Scoring weighs a cost by the cube of the deficit of the need it
#    drains, so an already-exhausted sim refuses a shower that a rested
#    one takes happily. See `score_advertisement`.
#
# `sprite` names an entry in assets/sprites/atlas.toml, and the build
# fails if it does not exist. It lives here rather than in the renderer
# on purpose: a lookup table in TypeScript would be a second copy of this
# list, so adding an object would be a two-file edit and giving one the
# wrong sprite would be a two-file bug. The names are Kenney's, kept
# verbatim so the provenance recorded in ASSETS.md stays checkable.
#
# `label` on an interaction is what the right-click flyout calls it. It
# is optional and falls back to the interaction's `id`, so nothing
# authored before the menu existed breaks - but a fallback reading
# `relieve_self` in a menu is a placeholder, not a label, so every shipped
# interaction carries one.
#
# **The labels are PLAIN, by the owner's direction (2026-07-31).** A
# first pass wrote them as deadpan jokes, and in play they read as
# confusing or cringeworthy rather than funny - "Soak until
# reconsidered" told a player nothing. The rule now: a short verb
# phrase that says exactly what the sim will do, nothing else. The
# game's voice (goal item 11) lives elsewhere and is authored with the
# owner, not smuggled into menu rows.
#
# A second rule from the same session: a label never NAMES the object it
# sits on. The flyout opens on the thing the player clicked, so "Sit in
# the armchair" is redundant at best - and wrong the day players place a
# second armchair, because "the armchair" asserts there is one. "Sit
# down" is complete. Nouns appear only as generic idiom that does not
# point at an instance: "Watch TV", "Take a shower", "Use the toilet".

[[object]]
id = "fridge"
name = "Chill-o-Matic 3000"
sprite = "kitchenFridgeBuiltIn"
# Station roles - [K1] in the M2f working design. A role is a fact
# about furniture ("this is where ingredients live"), kept apart from
# the activity tags on interactions.
roles = ["cold_storage"]

  # 40.0 was M0's hardcoded delta and is unchanged. The duration was 15,
  # also M0's, and it was raised to 30 in the alpha pass - see the block
  # comment at the top of this file for the arithmetic that forced it, and
  # `min_interaction_ticks` in content/tuning.toml for the rule.
  #
  # 30 ticks is 3 real seconds at 1x. A meal is one of the two most-performed
  # actions in the house - 13.6% of all interactions over a 12 000-tick trace
  # on the five-room lot, second to the toilet's 26.4%, and 28% back when the
  # house had eight objects in it - so it is also among the actions a player
  # watches most. At the old 15 it sampled 12 to 20 with a mean of 13.9, which
  # is 1.4 seconds of a sim standing at a fridge. Long enough to happen, too
  # short to read as eating.
  #
  # The world-hash golden vectors in crates/terri-sim/src/lib.rs and
  # web/tests/bridge.test.ts are built on this object, so both numbers move
  # them.
  [[object.interaction]]
  id = "grab_snack"
  label = "Grab a snack"
  advertises = { hunger = 40.0 }
  duration_ticks = 30
  slots = 1
  visual = { action = "eat", anchor = "object", facing = "toward_anchor" }

[[object]]
id = "bed"
name = "Sleepeazy Deluxe"
sprite = "bedBunk"

  # The FIRST object in shipped content that was not 1x1 - there are six now,
  # listed in `the_shipped_lot_satisfies_every_footprint_rule` - and the
  # measurement that forced it: `bedBunk` is drawn 93 px wide against a 32 px tile, so at
  # one tile a sim standing "beside" it had 88% of its own sprite inside the
  # bed's. No asset choice fixes that - every bed in the kit is at least 1.46
  # tiles wide - because a bed genuinely is a multi-tile object. Recorded as
  # [A-6] in docs/alpha-feel-notes.md.
  #
  # 2 wide and 1 deep, not the other way round: the sprite is drawn wider than
  # a tile and no deeper than one, and the footprint is the SIMULATION fact
  # that has to agree with the projection rather than with the art's bounding
  # box ([F1]). The origin is the placement tile and the extra tile runs +x
  # ([F2]), so the bunk at x = 9.0, y = 6.0 in content/lot.toml owns (9, 6)
  # and (10, 6) - the study's north wall, ending one tile short of the
  # divider at x = 11. Moving it east by two tiles is a build failure, not a
  # nudge.
  footprint = { width = 2, depth = 1 }

  # The largest single restore in the game and by far the longest, both
  # deliberately. Energy drains slowly (0.069 per tick), so sleeping
  # should be a rare whole-night commitment rather than a top-up squeezed
  # in between meals, and the long duration is what stops it winning on a
  # mild deficit.
  [[object.interaction]]
  id = "sleep"
  label = "Sleep"
  advertises = { energy = 100.0 }
  duration_ticks = 180
  slots = 1
  # The tag the circadian sleep drive keys on - [ML-tag]. One entry in
  # [circadian] covers every bed-shaped route to sleeping, exactly as one
  # authored fear covers every couch.
  tags = ["sleep"]

[[object]]
id = "shower"
name = "Rainfall Cubicle"
sprite = "showerRound"

  # The trade-off object, and the reason negative deltas are allowed. It
  # restores a lot of hygiene and costs some energy, so a tired sim puts
  # it off - which is precisely the interaction this milestone exists to
  # make visible. Contrast the sink below: less hygiene, no cost, and a
  # fraction of the time.
  [[object.interaction]]
  id = "take_shower"
  label = "Take a shower"
  advertises = { hygiene = 70.0, energy = -12.0 }
  duration_ticks = 45
  slots = 1

[[object]]
id = "toilet"
name = "Porcelain Standard"
sprite = "toiletSquare"

  # Cheap, fast and near-total. Bladder is the fastest-draining need
  # (0.139 per tick), so this has to be able to interrupt anything, and the
  # 95 delta is what achieves that without needing a special case.
  #
  # The duration was 12 - exactly `min_interaction_ticks` - and is now 24.
  # **The delta is what makes this interrupt things, not the duration**, so
  # doubling the length costs it less than it looks: at five tiles of travel
  # the score falls to 0.72 of its old value while still carrying the largest
  # delta in the house by 25 points. It is the third-shortest action, behind
  # the bathroom sink's 21 and the kitchen sink's 23, which is still the
  # "fast" this comment is about - and on the five-room lot it is now the
  # most-chosen action outright at 26.4%, ahead of the fridge.
  [[object.interaction]]
  id = "relieve_self"
  label = "Use the toilet"
  advertises = { bladder = 95.0 }
  duration_ticks = 24
  slots = 1

[[object]]
id = "television"
name = "Cathode Companion"
sprite = "televisionVintage"

  # Two slots, so it does not become contended when households grow past
  # one sim. More fun per tick than either the sofa or the bookshelf, and
  # no comfort at all, which is what the sofa trades against.
  #
  # THE `social` DELTA IS A PLACEHOLDER, and saying so here is the point.
  # `social` is meant to be satisfied by other sims, which is M2; until
  # then this is the one object in the house where a lone sim can plausibly
  # be kept company, and its two slots are also where two sims will watch
  # together.
  #
  # It exists because the alternative was worse. Until M1c's close-out no
  # object advertised `social` at all: it drained at 0.035 a tick, hit zero
  # at about tick 2 857 - 4.8 minutes at 1x - and stayed there for the rest
  # of the session, which would have shipped M1b's need bars with one bar
  # permanently empty and no action in the game able to fill it. Recorded
  # as [C2] in docs/alpha-feel-notes.md, and now a build-time rule:
  # `every_declared_need_can_be_satisfied_by_some_interaction` in
  # crates/terri-data/src/lib.rs fails if any declared need loses its last
  # positive advert.
  #
  # **24 IS MEASURED, AND THE OBVIOUS DIRECTION IS BACKWARDS.** Over 12 000
  # ticks of the shipped lot with the [O1] agent, matched pairs varying only
  # this number:
  #
  #   delta   social band        television's share of interactions
  #   none    0 from t=2857      6.6% (8 of 121)
  #   8       0 on 699 ticks     30.1% (44 of 146)
  #   14      21-52, floor 17    21.1% (28 of 133)
  #   24      33-69, floor 30    14.4% (18 of 125)
  #
  # A SMALLER delta makes the television MORE dominant, not less, which is
  # the opposite of what "keep the placeholder subtle" would suggest. The
  # reason is that urgency is CUBED: equilibrium sits where
  # `delta * deficit^3 / time_cost` matches what else the sim could be
  # doing, so halving the delta buys back only a cube root of deficit - the
  # sim holds social lower AND visits more often, because each visit
  # delivers less. Anybody tuning this should move it UP to make the
  # television less central.
  #
  # 24 is where every other need returns to roughly its no-advert level
  # (hygiene 79.0 against 79.2, bladder 72.6 against 75.7, 125 interactions
  # against 121) while social holds a live band instead of a floor. It is
  # still the lowest need in the house by 14 points, which is the intended
  # reading: a sim with only a television for company stays lonely, and M2
  # is what fixes that rather than a bigger number here.
  #
  # Not 22 or 26: rule 1 above, which requires exact uniqueness and both
  # are taken - 22 by the radio's `listen` and 26 by the bookshelf's
  # `read`. (22 was the SINK's when this was written, and the sink moved to
  # 32 in the pass that raised the short durations. Both numbers are still
  # unavailable, so the conclusion stands and only the owner changed -
  # which is the drift `no_two_shipped_interactions_share_a_duration_or_a_delta`
  # in crates/terri-data/src/lib.rs now catches, rather than leaving it to
  # whoever reads this next.) Not 12 either, and that one is a precaution
  # BEYOND rule 1 rather than an application of it - 12 and the shower's
  # -12.0 are already distinct values, so rule 1 permits it. The reason to
  # avoid it anyway is the same reason rule 1 exists: a mutation dropping a
  # negation would collapse the two into one value, and no test could then
  # tell the slots apart.
  #
  # One thing this DID cost, recorded as [C6] in docs/alpha-feel-notes.md
  # rather than hidden here: the bookshelf goes from 3 interactions to zero
  # and stays there at every delta tried, including 8. It was already the
  # least-used object in the house.
  # "Watch the news" and not "Watch television", because the news is the
  # institution [D-7]'s tone notes name directly - coverage of nothing at
  # enormous length - and because it is what makes the `social` advert
  # legible as the placeholder it is: the company this object provides is
  # a newsreader talking at an empty room.
  [[object.interaction]]
  id = "watch_tv"
  label = "Watch TV"
  advertises = { social = 24.0, fun = 30.0 }
  duration_ticks = 55
  slots = 2
  # An evening in front of it is a mild pleasure for anybody and a real
  # one for a sim whose hobby it is ([E2]). Base 2 - below reading's 3,
  # because watching is the passive end of the hobby spectrum.
  tags = ["television"]
  satisfaction = 2.0

[[object]]
id = "sofa"
name = "Chesterfield Regret"
sprite = "loungeSofaOttoman"

  # Two advertised needs, deliberately. [D6]'s scoring SUMS across
  # advertised deltas, and this is the first object in shipped content
  # where that is observable in the running game rather than only in a
  # test: neither 18 fun nor 34 comfort would beat the television's 30
  # fun on its own, and together they can.
  # "Sink into it" is the comfort delta and the object's name at once: the
  # Chesterfield Regret is the thing you meant to get up from. Physical
  # rather than clever, so it still reads as an instruction.
  [[object.interaction]]
  id = "lounge"
  label = "Sit down"
  advertises = { fun = 18.0, comfort = 34.0 }
  duration_ticks = 50
  slots = 2

[[object]]
id = "sink"
name = "Basin Basic"
sprite = "bathroomSinkSquare"

  # The quick partial fix for hygiene, and its whole reason for existing
  # is to give the shower something to lose to: a short action with no
  # energy cost against 45 ticks and a 12-energy cost. Which one wins
  # depends on how tired the sim is rather than on a threshold.
  #
  # **This was the worst-clipped interaction in the game and the reason the
  # alpha pass raised all three.** At 8 ticks its entire sampled band was
  # 4.8 to 11.2, which sits wholly below `min_interaction_ticks`, so every
  # single one of its interactions ran for exactly 12 ticks - measured, 6 of
  # 6 over 12 000 ticks, min and max both 12 - and it delivered 12/8 = 1.5x
  # its advertised hygiene, 33 rather than 22. `duration_variance` did
  # nothing at all for it.
  #
  # 21 is above the clipping line of 20 (`min_interaction_ticks / (1 -
  # duration_variance)`) with a tick of margin, so the floor is a safety net
  # again rather than the thing setting the length. It is still less than
  # half the shower's 45, which is the trade this object exists to offer.
  #
  # **THE DELTA WENT UP WITH THE DURATION, AND THAT IS NOT A COINCIDENCE -
  # 22 WOULD HAVE KILLED THIS OBJECT.** Raising the duration alone moved this
  # interaction's score denominator from `4*distance + 9` to
  # `4*distance + 22`, a factor of 0.69 at typical range, while its only
  # competitor - the shower - kept its 45 and lost nothing. Measured over
  # 12 000 ticks: sink usage fell from 6 interactions to **1**, which is
  # within a rounding error of the bookshelf's zero ([C6]). Fixing a duration
  # by making an object furniture is not a fix.
  #
  # 32 restores the ratio the duration change cost it: the two now score
  # within about 2% of each other at the observed mid-run need levels, so
  # which one a sim picks genuinely turns on how tired it is - which is the
  # sentence at the top of this comment, finally true rather than merely
  # intended. At the softmax temperature in content/tuning.toml a gap that
  # small is close to a coin toss, and that is the correct reading of "it
  # depends".
  #
  # 32 and not 33: rule 1 at the top of this file. 34 is the sofa's comfort
  # and 30 is the television's fun.
  [[object.interaction]]
  id = "wash_hands"
  label = "Wash hands"
  advertises = { hygiene = 32.0 }
  duration_ticks = 21
  slots = 1

[[object]]
id = "bookshelf"
name = "Wall of Intent"
sprite = "bookcaseClosedDoors"

  # The low end of the fun range, so the three fun objects span a real spread
  # instead of clustering and making the choice between them arbitrary.
  #
  # **34 ticks, not 70, and habituation is why the change finally works.** This
  # object was used ZERO times in 12 000 ticks across every measurement taken
  # before habituation existed - recorded as [C6] - and the reason was
  # arithmetic rather than taste. Score divides by `4 * distance + duration + 1`,
  # so its 70 ticks made it the most heavily penalised option in the house, and
  # nothing about it ever became less appealing to compete with.
  #
  # At 70 ticks even a FULLY habituated television still won: 30 fun and 24
  # social at the 0.45 floor is about 0.32 against this object's 0.29 at five
  # tiles. So habituation alone could not fix it, and raising its delta until it
  # won on merit it does not have is the fix [C6] rejected.
  #
  # At 34 it scores about 0.47 - it loses to a FRESH television at 0.71 and beats
  # a habituated one, which is the rotation the two mechanics are meant to
  # produce together. Still the shortest fun option, so "the low end of the
  # range" now means less fun per sitting rather than unusable.
  #
  # 34 * 0.6 = 20.4 clears `min_interaction_ticks`, so the band is not clipped.
  # "Read something improving" finishes the sentence the object's name
  # starts. A Wall of Intent holds books bought for the person you meant to
  # become, and "improving" is the word that era used for them - evergreen
  # rather than topical, and quietly sad, which is the register [C6]'s
  # least-used object in the house has earned.
  [[object.interaction]]
  id = "read"
  label = "Read a book"
  advertises = { fun = 26.0 }
  duration_ticks = 34
  slots = 1
  # The same "reading" tag as the wingback's settle_in: a hobby is an
  # ACTIVITY, not an object, so a reader loves both routes to it.
  tags = ["reading"]
  satisfaction = 3.0

# ============================================================================
# M2b: the rest of the house
# ============================================================================
#
# Everything above this line is the eight objects the one-room flat had.
# Everything below it is what turned that flat into five rooms; see
# docs/specs/2026-07-30-the-house-design.md and content/lot.toml.
#
# **Appended rather than grouped by room, and that is not laziness.** An
# object's position in this file is its `ObjectDefId`, which the compiled
# pack, every placement, and each sim's habituation table all carry. Moving
# `stove` up next to `fridge` because they share a room would renumber every
# definition after it. The rooms are a property of `lot.toml`, which is where
# a reader should go to find out what is next to what.
#
# **Roughly half of these have no interactions at all**, and that is a
# category rather than an omission. A house reads as a house because of the
# things in it that nobody uses on purpose: the counter, the coat rack, the
# box that was going to be unpacked. They are declared here because a
# footprint has to come from somewhere and because a name is a joke; they
# advertise nothing, so `select_action` never scores them, and they cost one
# entity each. `an_object_may_declare_no_interactions` in
# crates/terri-data/src/schema.rs is what keeps that legal.
#
# **The two rules at the top of this file still hold across all 30.** No two
# durations and no two deltas are equal anywhere in the file, which took some
# arranging at this size and is worth preserving: a test cannot tell one slot
# from another when two slots hold the same number ([L26], [L29]).

# ---- Kitchen ---------------------------------------------------------------

[[object]]
id = "stove"
name = "The Combustible Optimist"
sprite = "kitchenStove"
roles = ["hob"]

  # **`cook_meal` RETIRED at M2f PR 2, superseded by the cook_dinner
  # chain in content/chains.toml.** The standalone interaction was the
  # fridge's rival - it came into its own once habituation wore the
  # fridge toward the floor, the first deliberately-tuned rotation in
  # the house - and the chain inherits that whole role with the walk
  # made honest: the meal now costs the counter, the hob and the table
  # it always pretended not to. Two cooking verbs in one kitchen would
  # be a menu lie, so the stove keeps no interaction of its own; its
  # `cooking` tag (Bill's hobby, Casey's capability) lives on the
  # chain's hob step, which happens HERE - the hob role above is what
  # the chain resolves to. The pre-chain numbers, for whoever rebalances
  # against them: hunger 62 + comfort 8 over 95 ticks, satisfaction 2.5.

[[object]]
id = "counter"
name = "Surface of Deferred Decisions"
sprite = "kitchenCabinet"
# The middle step this object was placed for, per the comment below -
# the chain has arrived.
roles = ["prep_surface"]

  # No interactions, deliberately. This is the counter the cooking chain in
  # docs/specs/2026-07-29-multi-step-interactions-design.md will use as its
  # middle step, and it is placed now so the kitchen has the geometry that
  # chain needs before the chain exists. Giving it a standalone "wipe the
  # counter" today would be an interaction the chain then has to work around.
  #
  # Placed twice in lot.toml. One definition, two placements: a run of
  # cabinets is several of the same cabinet, and modelling it as one wide
  # object would give the kitchen a single 3x1 obstacle instead of separate
  # approach points.

[[object]]
id = "kitchen_sink"
name = "Basin, Communal"
sprite = "kitchenSink"
# A second prep station, so two cooks do not serialise on one counter
# tile and a one-counter lot still compiles.
roles = ["prep_surface"]

  # **The chore.** 20 hygiene is the smallest of the four hygiene deltas - a
  # third of the shower's 70 - and it costs 6 comfort, which makes this the
  # only object in the house that a sim can be talked out of by being
  # uncomfortable rather than by being busy.
  #
  # That is deliberate, and it is the same mechanism the shower's energy cost
  # uses: scoring weighs a cost by the CUBE of the deficit of the need it
  # drains, so a sim whose comfort is already low refuses to do the washing
  # up, and a sim fresh off the sofa gets on with it. The joke is that this is
  # exactly how people behave.
  #
  # It is a bad way to get clean and it is meant to be - the bathroom sink
  # gives 32 for 21 ticks. What this offers is proximity: it is in the
  # kitchen, on the far side of the house from the bathroom, so a sim that is
  # only slightly grubby and already standing by the fridge has a local
  # option. That is the same "cheap rival on the far side of the lot"
  # argument the bathroom sink was introduced with, applied one level down.
  [[object.interaction]]
  id = "wash_up"
  label = "Wash the dishes"
  # **20 and 23, raised from 14 and 27 after the first trace.** At 14 hygiene
  # this was at zero uses in 12 000 ticks, and the candidate table said why: it
  # is the fourth hygiene option in a house where hygiene is over-supplied
  # 1.44 to 1, so a delta a fifth of the shower's could not win from anywhere.
  # 20 for 23 ticks makes it the second-fastest action in the house, behind
  # the bathroom sink's 21 - which is the right axis for a chore. The case
  # for it is that it is quick and it is here, never that it is thorough.
  #
  # 23 rather than 19, which was tried first: `min_interaction_ticks` is 12 and
  # `duration_variance` is 0.4, so 19 samples down to 11.4 and the bottom of
  # the band gets clipped by the floor. 23 * 0.6 = 13.8 clears it.
  advertises = { hygiene = 20.0, comfort = -6.0 }
  duration_ticks = 23
  slots = 1

[[object]]
id = "dining_table"
name = "The Table Nobody Sits At"
sprite = "table"
footprint = { width = 2, depth = 1 }
# The chain's terminal station: the table finally gets somebody to
# sit at it.
roles = ["eating_surface"]

  # 37 comfort over 62 ticks is 0.597 per tick standing beside it, against the
  # long sofa's 0.597, the ottoman sofa's 0.667 and the armchair's 0.707. So
  # it is the joint-worst seat in the house by a small margin rather than by
  # half, which is the whole of what the second balance pass changed - see
  # below. What it has on top is 11 social, which no other seat advertises at
  # all, so a sim that is both uncomfortable and lonely comes here and a sim
  # that is merely uncomfortable does not.
  #
  # **37 rather than the 23 this shipped with for one trace, and the 44 before
  # that.** [B6] halved every new comfort delta to stop comfort being
  # over-supplied, and overshot: at 23 this and the long sofa were worth about
  # 0.37 per tick against the pre-existing ottoman sofa's 0.667, so the
  # ottoman took every comfort decision in the house - 72 uses in a
  # 120 000-tick trace against zero for either of these. Halving fixed the
  # supply and created a monopoly. Matching the rate is what fixes both.
  #
  # Two slots, so two sims can sit down together. That is this object's real
  # job once there is a household: it is the only piece of furniture in the
  # house whose social value is the point rather than a side effect, and it
  # is where the cooking chain's meal ends up.
  #
  [[object.interaction]]
  id = "sit_properly"
  label = "Sit down to eat"
  advertises = { comfort = 37.0, social = 11.0 }
  duration_ticks = 62
  slots = 2

[[object]]
id = "chair"
name = "Chair, Standard Issue"
sprite = "chair"

  # No interactions. A chair at a table is where a sim sits when it uses the
  # TABLE; it is not a separate thing to sit on. Modelling it as one would put
  # two competing comfort adverts a tile apart and let a sim satisfy itself on
  # the chair while ignoring the meal on the table beside it.
  #
  # Placed twice, flanking the table rather than tucked under it, because a
  # footprint blocks its tile: a chair under the table would be an overlap and
  # the build would refuse it.

[[object]]
id = "trashcan"
name = "Receptacle for Later"
sprite = "trashcan"

  # No interactions. Scenery, and a promise.

# ---- Living room -----------------------------------------------------------

[[object]]
id = "long_sofa"
name = "The Sectional Compromise"
sprite = "loungeSofaLong"
footprint = { width = 2, depth = 1 }

  # **Three slots, which is the highest in the house, and the reason this
  # object exists.** Every other seat holds one or two. When there is a
  # household rather than a single sim, this is the only place three of them
  # can be at once, so this is where they will end up - which is where they
  # should end up.
  #
  # 43 comfort, 13 fun - the smallest fun delta in the file - and 9 energy,
  # which is the only POSITIVE energy delta outside the two beds. Lying on the
  # sofa is genuinely restful and genuinely not sleep: 9 against the double
  # bed's 108 means it can take the edge off tiredness without ever being a
  # substitute for a night.
  #
  # 43 is the largest comfort delta in the house, but over 72 ticks it is
  # 0.597 per tick, which is the LOWEST rate of the four seats - the ottoman
  # sofa manages 0.667 in 50 ticks and the armchair 0.707 in 41. So this is
  # the one you commit to rather than the one you pick, which is what a
  # sectional is. What it has that none of them has is room for three.
  #
  # **43 rather than the 27 this shipped with for one trace, and the 52 before
  # that**; the dining table's comment carries the measurement, because the
  # two were wrong together and for the same reason.
  #
  # 72 ticks, longer than the ottoman's 50, so the two sofas are not
  # interchangeable: the small one is a perch and this one is a commitment.
  [[object.interaction]]
  id = "stretch_out"
  label = "Lie down"
  advertises = { comfort = 43.0, fun = 13.0, energy = 9.0 }
  duration_ticks = 72
  slots = 3

[[object]]
id = "armchair"
name = "The Chair That Is His"
sprite = "loungeChair"

  # One slot, and 29 comfort at 41 ticks - the best comfort-per-tick in the
  # house, at 0.707 standing beside it against the ottoman sofa's 0.667 and
  # 0.597 for both of the big seats. So it is narrowly the better choice and
  # there is exactly one of it, which is the entire joke: with a household,
  # whoever gets there first has it and everybody else has the sectional
  # compromise.
  #
  # Narrowly is the point, and it is the second thing [B6]'s halving got
  # wrong. At 38 - what this shipped with originally - it beat every other
  # seat by a third and the choice was not a choice; at 29 against a field of
  # 0.60 to 0.67 it is a preference rather than a verdict.
  #
  # This is also the cleanest contention fixture in the lot.
  [[object.interaction]]
  id = "take_the_chair"
  label = "Sit down"
  advertises = { comfort = 29.0 }
  duration_ticks = 41
  slots = 1

[[object]]
id = "radio"
name = "Frequency of Record"
sprite = "radio"

  # 22 fun and 5 social at 38 ticks. Deliberately sat just under the
  # bookshelf's 26 fun at 34 ticks, so the two are close enough that
  # habituation decides between them rather than raw score - which gives the
  # least-used corner of the house something to rotate with.
  #
  # The social is the smallest delta in the file, and it is honest: the radio
  # is company in the way the television is company, which is to say barely.
  #
  # **5 rather than 7, and the reason is the rule the television's comment
  # states**: the desk advertises `energy = -7.0`, so a mutation dropping that
  # negation would produce a 7.0 identical to this one and no test could tell
  # the two slots apart. No |value| appears in both signs anywhere in the
  # file, and this was the one pair that broke it.
  # Both are placeholders for other sims and both should lose to a real one
  # the moment sims can satisfy each other.
  [[object.interaction]]
  id = "listen"
  label = "Listen to the radio"
  advertises = { fun = 22.0, social = 5.0 }
  duration_ticks = 38
  slots = 2

