# Social interactions deliver to both participants. Ordinary chats provide
# positive Social at every affinity level, scaled by each person's satisfaction
# and feeling toward their partner. Family adds an independent bonus.
# The authored Chat reward supplies 1.5 Social per tick before multipliers,
# twice its previous rate. Selected voice clips still set the actual length.
# Chat Fun and voice timing retain their existing values.
# Completed chats also grant the tuned directional opinion reward.

[[interaction]]
id = "chat"
label = "Chat"
visual = { action = "talk", anchor = "partner", facing = "toward_anchor" }
advertises = { social = 100.5, fun = 10.05 }
duration_ticks = 67
slots = 2
tags = ["socialising"]
satisfaction = 2.0

[[interaction]]
id = "fight"
label = "Fight"
visual = { action = "talk", anchor = "partner", facing = "toward_anchor" }
advertises = {}
duration_ticks = 67
slots = 2
tags = ["fighting"]
