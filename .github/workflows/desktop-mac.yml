# Builds the installed game for Mac (arm64 and x64), signs it with the
# owner's Developer ID Application certificate (team G8NAYQQS78), notarizes
# it with an App Store Connect API key, and adds the disk images, the update
# zips and latest-mac.yml to a GitHub release. The owner approved this
# workflow on 2026-11-25 because he has no Mac. The Windows installer is
# built locally by desktop/scripts/release.js; see docs/desktop-release.md.
#
# Two triggers only. Publishing a release builds for that release's tag. A
# maintainer can also run it by hand for an existing release's tag. It never
# runs on push or pull request.
name: Desktop Mac build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and upload to, such as v1.1.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-mac-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, sign, notarize and upload Mac builds
    runs-on: macos-15
    timeout-minutes: 120
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check the tag and the signing secrets
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_CERT: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}
          HAS_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD != '' }}
          HAS_API_KEY: ${{ secrets.APPLE_API_KEY_P8 != '' }}
          HAS_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID != '' }}
          HAS_API_ISSUER: ${{ secrets.APPLE_API_ISSUER != '' }}
        run: |
          set -eu
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Not a release tag: $TAG" >&2; exit 1 ;;
          esac
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName > /dev/null
          missing=""
          [ "$HAS_CERT" = "true" ] || missing="$missing MAC_CERT_P12_BASE64"
          [ "$HAS_CERT_PASSWORD" = "true" ] || missing="$missing MAC_CERT_PASSWORD"
          [ "$HAS_API_KEY" = "true" ] || missing="$missing APPLE_API_KEY_P8"
          [ "$HAS_API_KEY_ID" = "true" ] || missing="$missing APPLE_API_KEY_ID"
          [ "$HAS_API_ISSUER" = "true" ] || missing="$missing APPLE_API_ISSUER"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. See 'Mac signing secrets' in docs/desktop-release.md." >&2
            exit 1
          fi

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          # Build steps run third-party install scripts; keep the token out of .git/config.
          persist-credentials: false

      - name: Check the version matches the tag
        run: |
          set -eu
          version=$(node -p "require('./web/package.json').version")
          test "v$version" = "$TAG" || { echo "web/package.json says $version, tag is $TAG" >&2; exit 1; }

      # rust-toolchain.toml is the single source for the version and targets.
      - name: Install the pinned toolchain
        run: rustup show

      - uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          version: 'v0.15.0'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Build the WASM package
        run: wasm-pack build crates/terri-wasm --target web --out-dir ../../web/src/wasm

      - name: Build the website
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Check the website build
        run: |
          set -eu
          test -f web/dist/index.html
          test -f web/dist/changelog/index.html
          test -f web/dist/guide/index.html
          test -f web/dist/guide/ui-elements/index.html
          test -n "$(find web/dist -name '*.wasm' | head -1)"

      - name: Install the app's build tools
        working-directory: desktop
        env:
          # electron-builder downloads its own Electron for each processor.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci

      # The secrets exist only in this step and the cleanup step. Files are
      # written with a restrictive umask under the runner's temp folder.
      - name: Build, sign and notarize
        working-directory: desktop
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -eu
          umask 077
          secrets_dir="$RUNNER_TEMP/natural-causes-signing"
          mkdir -p "$secrets_dir"
          printf '%s' "$MAC_CERT_P12_BASE64" | base64 --decode > "$secrets_dir/certificate.p12"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$secrets_dir/AuthKey.p8"
          export CSC_LINK="$secrets_dir/certificate.p12"
          export APPLE_API_KEY="$secrets_dir/AuthKey.p8"
          unset MAC_CERT_P12_BASE64 APPLE_API_KEY_P8
          npx electron-builder --mac --config electron-builder.config.js --publish never

      - name: Remove signing files
        if: always()
        run: rm -rf "$RUNNER_TEMP/natural-causes-signing"

      - name: Check signatures and notarization
        working-directory: desktop/dist
        run: |
          set -eu
          for app in "mac-arm64/Natural Causes.app" "mac/Natural Causes.app"; do
            codesign --verify --deep --strict "$app"
            codesign -dv --verbose=2 "$app" 2> codesign.txt
            grep -q 'TeamIdentifier=G8NAYQQS78' codesign.txt || { echo "$app is not signed by team G8NAYQQS78" >&2; exit 1; }
            grep -q 'Authority=Developer ID Application' codesign.txt || { echo "$app is not signed with a Developer ID Application certificate" >&2; exit 1; }
            grep -q 'flags=.*runtime' codesign.txt || { echo "$app does not use the hardened runtime" >&2; exit 1; }
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose "$app"
          done
          rm codesign.txt

      - name: Checksum and upload
        working-directory: desktop/dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version="${TAG#v}"
          files="Natural-Causes-$version-arm64.dmg Natural-Causes-$version-x64.dmg"
          files="$files Natural-Causes-$version-arm64-mac.zip Natural-Causes-$version-arm64-mac.zip.blockmap"
          files="$files Natural-Causes-$version-x64-mac.zip Natural-Causes-$version-x64-mac.zip.blockmap latest-mac.yml"
          for file in $files; do test -f "$file" || { echo "electron-builder did not produce $file" >&2; exit 1; }; done
          grep -q "^version: $version$" latest-mac.yml || { echo "latest-mac.yml does not name $version" >&2; exit 1; }
          grep -q "Natural-Causes-$version-arm64-mac.zip" latest-mac.yml
          grep -q "Natural-Causes-$version-x64-mac.zip" latest-mac.yml
          shasum -a 256 Natural-Causes-$version-arm64.dmg Natural-Causes-$version-x64.dmg \
            Natural-Causes-$version-arm64-mac.zip Natural-Causes-$version-x64-mac.zip > SHA256SUMS-macos.txt
          cat SHA256SUMS-macos.txt
          ls -l $files
          # latest-mac.yml goes last, so no Mac is told about zips still uploading.
          gh release upload "$TAG" ${files% latest-mac.yml} SHA256SUMS-macos.txt --clobber --repo "$GITHUB_REPOSITORY"
          gh release upload "$TAG" latest-mac.yml --clobber --repo "$GITHUB_REPOSITORY"
