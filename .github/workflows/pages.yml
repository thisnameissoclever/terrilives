name: Deploy to GitHub Pages

# Publishes the playable alpha so it can be looked at from any device,
# including a phone that is not on the same network.
#
# Execution stays separate from ci.yml because this workflow ships to the
# public internet. Relevant production inputs publish directly from main after
# local verification and independent review. Manual publication requires the
# exact main commit. Both paths build once and reject stale release artifacts.
#
# KNOWN LIMIT, recorded because it contradicts TIM-TODO [T18]: GitHub
# Pages cannot set response headers, so it cannot send COOP and COEP.
# Those are required for SharedArrayBuffer, and therefore for WASM
# threads. Nothing needs threads today - the simulation is single
# threaded by design ([D4]) - but [A9] plans parallel systems, and the
# day that lands this host stops being sufficient. Moving is cheap while
# the artifact is a static bundle; it will not get cheaper.

on:
  push:
    branches: [main]
    # Ordered patterns must equal changes.PAGES_PATHS for stale-release checks.
    paths:
      - '.github/workflows/pages.yml'
      - '.github/scripts/changes.py'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'crates/*/Cargo.toml'
      - 'crates/*/build.rs'
      - 'crates/*/src/**'
      - '!crates/*/src/**/tests/**'
      - '!crates/*/src/**/tests.rs'
      - '!crates/*/src/**/*_tests.rs'
      - '!crates/*/src/test_content.rs'
      - 'crates/terri-data/build_pre_books.rs'
      - 'crates/terri-data/tests/fixtures/pre-books/*.toml'
      - 'crates/terri-data/tests/fixtures/pre-books/source-revision.txt'
      - 'crates/terri-data/tests/fixtures/pre-books-920abaf/*.toml'
      - 'crates/terri-data/tests/fixtures/pre-books-920abaf/source-revision.txt'
      - 'crates/terri-data/tests/fixtures/pre-books-f3cb7a1c/*.toml'
      - 'crates/terri-data/tests/fixtures/pre-books-f3cb7a1c/source-revision.txt'
      - 'crates/terri-data/tests/fixtures/pre-books-89040f82/*.toml'
      - 'crates/terri-data/tests/fixtures/pre-books-89040f82/source-revision.txt'
      - 'crates/terri-data/tests/fixtures/pre-books-2f319c3b/*.toml'
      - 'crates/terri-data/tests/fixtures/pre-books-2f319c3b/source-revision.txt'
      - 'content/*.toml'
      - 'assets/sprites/atlas.toml'
      - 'assets/models/kitchen/wall-registration.json'
      - 'assets/models/architecture-depth.json'
      - 'assets/models/sims/character-creator/surface-policy.json'
      - 'assets/models/sims/character-creator/export/manifest.json'
      - 'assets/models/sims/character-creator/export/runtime*.bin'
      - 'assets/models/sims/character-creator/clips/clips.json'
      - 'assets/models/sims/character-creator/clips/**/runtime*.bin'
      - 'assets/models/sims/character-creator/clips/*/parts.json'
      - 'assets/models/sims/character-repair/fixture-depth/manifest.json'
      - 'assets/models/sims/character-repair/fixture-depth/*.rgba'
      - 'assets/models/sims/character-repair/aquarium-depth/manifest.json'
      - 'assets/models/sims/character-repair/aquarium-depth/*.rgba'
      - 'assets/models/sims/character-repair/outdoor-depth/manifest.json'
      - 'assets/models/sims/character-repair/outdoor-depth/*.rgba'
      - 'assets/models/sims/character-repair/shelf-depth/manifest.json'
      - 'assets/models/sims/character-repair/shelf-depth/*.rgba'
      - 'assets/models/sims/character-repair/components/manifest.json'
      - 'assets/models/sims/character-repair/components/*.rgba'
      - 'assets/models/sims/character-repair/dropped-book/manifest.json'
      - 'assets/models/sims/character-repair/dropped-book/*.rgba'
      - 'web/src/**'
      - '!web/src/**/*.test.*'
      - '!web/src/**/*.spec.*'
      - '!web/src/**/__tests__/**'
      - 'web/public/**'
      - 'web/index.html'
      - 'web/package.json'
      - 'web/package-lock.json'
      - 'web/vite.config.ts'
      - 'web/tsconfig.json'
      - 'web/changelog/**'
      - 'web/guide/**'
      - 'docs/player/**'
      - 'scripts/build-changelog.mjs'
      - 'scripts/build-player-guide.mjs'
      - 'scripts/player-markdown.mjs'
      - 'scripts/player-coverage.mjs'
      - 'scripts/player-illustrations.mjs'
      - 'scripts/player-activity-filters.mjs'
  workflow_dispatch:
    inputs:
      validated_sha:
        description: Full main commit whose relevant checks passed locally
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

# Keep separate build and deployment queues. Let an in-flight publication
# finish, then check current main immediately before releasing its artifact.

jobs:
  decide:
    if: github.repository == 'thisnameissoclever/terrilives'
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.content.outputs.site }}
      tested_sha: ${{ steps.content.outputs.tested_sha }}
    steps:
      - name: Authenticate the publication revision
        id: content
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          VALIDATED_SHA: ${{ inputs.validated_sha }}
          PUSH_SHA: ${{ github.event.after }}
          SOURCE_REPOSITORY: ${{ github.event.repository.full_name }}
        run: |
          set -eu
          test "$GITHUB_REPOSITORY" = "thisnameissoclever/terrilives"
          test "$SOURCE_REPOSITORY" = "$GITHUB_REPOSITORY"
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [ "$EVENT" = "workflow_dispatch" ]; then
            test "$VALIDATED_SHA" = "$GITHUB_SHA"
            current_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
            test "$current_sha" = "$VALIDATED_SHA"
          else
            test "$EVENT" = "push"
            test "$PUSH_SHA" = "$GITHUB_SHA"
          fi
          echo "tested_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "site=true" >> "$GITHUB_OUTPUT"

  build:
    needs: decide
    if: needs.decide.outputs.site == 'true'
    concurrency:
      group: pages-build
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      # Build the authenticated event revision, even if main moves while queued.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.decide.outputs.tested_sha }}

      # rust-toolchain.toml is the single source for the version,
      # components and targets.
      - name: Install the pinned toolchain
        run: rustup show

      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'v0.15.0'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # web/src/wasm/ is gitignored build output, so a fresh clone has
      # none. This must run before the Vite build imports it.
      - name: Build the WASM package
        run: wasm-pack build crates/terri-wasm --target web --out-dir ../../web/src/wasm

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build the site
        working-directory: web
        run: npm run build

      # Fail loudly rather than deploying an empty directory. A Pages
      # deploy of nothing succeeds and serves a 404, which reads as a
      # broken URL rather than a broken build.
      - name: Verify the build produced something
        run: |
          set -eu
          test -f web/dist/index.html
          test -f web/dist/changelog/index.html
          test -f web/dist/guide/index.html
          test -f web/dist/guide/ui-elements/index.html
          wasm=$(find web/dist -name '*.wasm' | head -1)
          test -n "$wasm"
          echo "Game, changelog and $wasm present"
          du -sh web/dist

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: [decide, build]
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # A rerun or overlapping publication can finish after a newer main run. The
      # concurrency queue orders Pages runs by arrival, not source history, so
      # re-check the live ref immediately before deployment and leave the
      # existing public revision alone when this artifact is stale.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.decide.outputs.tested_sha }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: .github/scripts/changes.py
          sparse-checkout-cone-mode: false

      # A tip that differs only in unpublished documentation serves the same
      # site, and its own documentation-only run will not
      # deploy, so the tested revision is still the one to publish. Without
      # this, a documentation push landing during a deploy would leave the
      # game change before it unpublished.
      - name: Confirm the tested revision is still the main tip
        id: release
        env:
          TESTED_SHA: ${{ needs.decide.outputs.tested_sha }}
        run: |
          set -eu
          current_sha=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          [[ "$current_sha" =~ ^[0-9a-f]{40}$ ]]
          if [ "$current_sha" = "$TESTED_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            echo "Deploying current main revision $TESTED_SHA"
          else
            git fetch --quiet --no-tags --depth=1 --filter=blob:none origin "$current_sha"
            classification=$(python3 -B .github/scripts/changes.py compare "$TESTED_SHA" "$current_sha")
            site=$(printf '%s\n' "$classification" | sed -n 's/^site=//p')
            if [ "$site" = "false" ]; then
              echo "current=true" >> "$GITHUB_OUTPUT"
              echo "Deploying $TESTED_SHA; main is $current_sha, which changes no publication inputs"
            else
              echo "current=false" >> "$GITHUB_OUTPUT"
              echo "Skipping stale revision $TESTED_SHA; current main is $current_sha"
            fi
          fi

      - id: deployment
        if: steps.release.outputs.current == 'true'
        uses: actions/deploy-pages@v4
