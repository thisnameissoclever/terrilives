name: CI

on:
  workflow_dispatch:
    inputs:
      validated_sha:
        description: Exact owner-reviewed revision
        required: true
        type: string
      local_verification_ref:
        description: SHA-256 reference of the owner-reviewed local report
        required: true
        type: string
      runtime_publish:
        description: Publish the mutation runtime image only
        type: boolean
        default: false
      runtime_build_sha:
        description: Exact source revision to publish
        type: string
      mutation_mode:
        description: Production planning, complete campaign or interruption/recovery fixture
        type: choice
        options: [plan, production, fixture]
        default: plan
      qualification_run_id:
        description: Optional explicit qualified fixture run; otherwise bounded discovery
        type: string
      transport_probe_job_id:
        description: Optional completed historical job for the fixture tool's log transport diagnostic only
        type: string
      resume_run_id:
        description: Explicit production predecessor run
        type: string
      resume_plan_artifact_id:
        description: Original immutable plan artifact ID
        type: string
      resume_chain:
        description: Explicit authenticated predecessor chain JSON
        type: string

permissions:
  contents: read
  actions: read
  packages: read

env:
  MUTATION_RUNTIME_IMAGE: &mutation-runtime-image ghcr.io/thisnameissoclever/terrilives-mutation-runtime@sha256:cfeff66d1e4710a9676e13b432915beac1c7395d776e0e9a75d4805b81a20cbe

defaults:
  run:
    shell: bash

# Explicit manual runs keep their existing event/ref isolation and shared mutation slots.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Keep this completed predecessor for the real job-token transport probe.
  changes:
    outputs:
      code: ${{ steps.authorize.outputs.code }}
      validated_sha: ${{ steps.authorize.outputs.validated_sha }}
      local_verification_ref: ${{ steps.authorize.outputs.local_verification_ref }}
    if: >-
      github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner &&
      inputs.validated_sha == github.sha
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate owner-reviewed local evidence
        id: authorize
        env:
          VALIDATED_SHA: ${{ inputs.validated_sha }}
          LOCAL_VERIFICATION_REF: ${{ inputs.local_verification_ref }}
        run: python3 -B scripts/check-local-ci.py authorize --sha "$VALIDATED_SHA" --head "$GITHUB_SHA" --actor "$GITHUB_ACTOR" --owner "$GITHUB_REPOSITORY_OWNER" --reference "$LOCAL_VERIFICATION_REF"

  ci-guards:
    name: Owner local-verification authorization
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner &&
      inputs.validated_sha == github.sha
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate owner-reviewed local evidence
        id: authorize
        env:
          VALIDATED_SHA: ${{ inputs.validated_sha }}
          LOCAL_VERIFICATION_REF: ${{ inputs.local_verification_ref }}
        run: python3 -B scripts/check-local-ci.py authorize --sha "$VALIDATED_SHA" --head "$GITHUB_SHA" --actor "$GITHUB_ACTOR" --owner "$GITHUB_REPOSITORY_OWNER" --reference "$LOCAL_VERIFICATION_REF"

  runtime-publish:
    needs: [changes, ci-guards]
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.runtime_publish == true &&
      github.actor == github.repository_owner && inputs.runtime_build_sha == github.sha &&
      needs.changes.result == 'success' && needs.ci-guards.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      packages: write
    concurrency:
      group: ci-mutation-shard-0
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
      - name: Validate the exact runtime source revision
        env:
          RUNTIME_BUILD_SHA: ${{ inputs.runtime_build_sha }}
        run: |
          set -eu
          [[ "$RUNTIME_BUILD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [ "$RUNTIME_BUILD_SHA" = "$GITHUB_SHA" ]
      - name: Build the mutation runtime image
        run: python3 -B .github/scripts/mutation_runtime_image.py build --tag "ghcr.io/thisnameissoclever/terrilives-mutation-runtime:source-$GITHUB_SHA" --output "$RUNNER_TEMP/mutation-runtime-build"
      - name: Publish the mutation runtime image
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B .github/scripts/mutation_runtime_image.py publish --tag "ghcr.io/thisnameissoclever/terrilives-mutation-runtime:source-$GITHUB_SHA" --output "$RUNNER_TEMP/mutation-runtime-build"

  mutation-tool:
    name: mutation-fixture-tool
    needs: [changes, ci-guards]
    if: inputs.runtime_publish != true && needs.ci-guards.result == 'success' && github.event_name == 'workflow_dispatch' && inputs.mutation_mode == 'fixture'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: *mutation-runtime-image
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
      options: --cpus 2 --memory 6g
    concurrency:
      group: ci-mutation-shard-0
      cancel-in-progress: false
      queue: max
    outputs:
      tool_id: ${{ steps.prepare.outputs.tool_id || steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify the pinned mutation runtime
        run: python3 -B .github/scripts/mutation_runtime.py verify --root .
      - name: Build or restore the pinned fixture tool
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          MUTATION_JOB_NAME: mutation-fixture-tool
          TRANSPORT_PROBE_JOB_ID: ${{ inputs.transport_probe_job_id }}
        run: python3 -B .github/scripts/mutation_workflow.py tool --scope fixture
      - name: Upload immutable tool
        id: upload
        if: steps.prepare.outputs.reused == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: mutation-tool-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mutation-job/tool/
          if-no-files-found: error
          retention-days: 30
      - name: Bind tool upload to producer log
        if: steps.upload.outputs.artifact-id != ''
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: echo "MUTATION_ARTIFACT_ID=$ARTIFACT_ID"

  mutation-plan:
    name: ${{ inputs.mutation_mode == 'fixture' && 'mutation-fixture-plan' || 'mutation-plan' }}
    needs: [changes, ci-guards, mutation-tool]
    if: >-
      inputs.runtime_publish != true &&
      always() && !cancelled() && needs.changes.result == 'success' &&
      needs.ci-guards.result == 'success' &&
      needs.changes.outputs.code == 'true' &&
      github.event_name == 'workflow_dispatch' &&
      (inputs.mutation_mode != 'fixture' || needs.mutation-tool.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: *mutation-runtime-image
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
      options: --cpus 2 --memory 6g
    concurrency:
      group: ci-mutation-shard-0
      cancel-in-progress: false
      queue: max
    outputs:
      plan_id: ${{ steps.prepare.outputs.plan_id || steps.upload.outputs.artifact-id }}
      chain: ${{ steps.prepare.outputs.chain }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify the pinned mutation runtime
        run: python3 -B .github/scripts/mutation_runtime.py verify --root .
      - name: Authenticate qualification and freeze or recover the original plan
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          MUTATION_JOB_NAME: ${{ inputs.mutation_mode == 'fixture' && 'mutation-fixture-plan' || 'mutation-plan' }}
          MUTATION_SCOPE: ${{ inputs.mutation_mode == 'fixture' && 'fixture' || 'production' }}
          TOOL_ARTIFACT_ID: ${{ needs.mutation-tool.outputs.tool_id }}
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
          RESUME_PLAN_ARTIFACT_ID: ${{ inputs.resume_plan_artifact_id }}
          RESUME_CHAIN: ${{ inputs.resume_chain }}
        run: python3 -B .github/scripts/mutation_workflow.py plan --scope "$MUTATION_SCOPE"
      - name: Upload immutable original plan
        id: upload
        if: steps.prepare.outputs.reused == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: mutation-${{ inputs.mutation_mode == 'fixture' && 'fixture-' || '' }}plan-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mutation-job/plan/
          if-no-files-found: error
          retention-days: 30
      - name: Bind plan upload to producer log
        if: steps.upload.outputs.artifact-id != ''
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: echo "MUTATION_ARTIFACT_ID=$ARTIFACT_ID"

  mutation-native-pilot:
    name: mutation-native-pilot
    needs: mutation-plan
    if: ${{ inputs.runtime_publish != true && !cancelled() && inputs.mutation_mode == 'production' && inputs.resume_run_id == '' && needs.mutation-plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: *mutation-runtime-image
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
      options: --cpus 2 --memory 6g
    concurrency:
      group: ci-mutation-shard-0
      cancel-in-progress: false
      queue: max
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify the pinned mutation runtime
        run: python3 -B .github/scripts/mutation_runtime.py verify --root .
      - name: Measure native work without production coverage
        id: execute
        env:
          GH_TOKEN: ${{ github.token }}
          MUTATION_JOB_NAME: mutation-native-pilot
          PLAN_ARTIFACT_ID: ${{ needs.mutation-plan.outputs.plan_id }}
          MUTATION_CHAIN: ${{ needs.mutation-plan.outputs.chain }}
        run: python3 -B .github/scripts/mutation_workflow.py native-pilot --scope production
      - name: Upload native diagnostic evidence
        id: upload
        if: always() && steps.execute.outputs.native_name != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.execute.outputs.native_name }}
          path: ${{ runner.temp }}/mutation-job/native/
          if-no-files-found: error
          retention-days: 30
      - name: Bind native upload to producer log
        if: always() && steps.upload.outputs.artifact-id != ''
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: echo "MUTATION_ARTIFACT_ID=$ARTIFACT_ID"

  mutation-native-pilot-report:
    name: mutation-native-pilot-report
    needs: [mutation-plan, mutation-native-pilot]
    if: ${{ inputs.runtime_publish != true && !cancelled() && inputs.mutation_mode == 'production' && inputs.resume_run_id == '' && needs.mutation-plan.result == 'success' && needs.mutation-native-pilot.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: *mutation-runtime-image
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
      options: --cpus 2 --memory 6g
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify the pinned mutation runtime
        run: python3 -B .github/scripts/mutation_runtime.py verify --root .
      - name: Authenticate finished native measurements
        id: execute
        env:
          GH_TOKEN: ${{ github.token }}
          MUTATION_JOB_NAME: mutation-native-pilot-report
          PLAN_ARTIFACT_ID: ${{ needs.mutation-plan.outputs.plan_id }}
          MUTATION_CHAIN: ${{ needs.mutation-plan.outputs.chain }}
          NATIVE_PILOT_ARTIFACT_ID: ${{ needs.mutation-native-pilot.outputs.artifact_id }}
        run: python3 -B .github/scripts/mutation_workflow.py native-report --scope production
      - name: Upload finished native report
        id: upload
        if: always() && steps.execute.outputs.native_name != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.execute.outputs.native_name }}
          path: ${{ runner.temp }}/mutation-job/native/
          if-no-files-found: error
          retention-days: 30
      - name: Bind native upload to producer log
        if: always() && steps.upload.outputs.artifact-id != ''
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: echo "MUTATION_ARTIFACT_ID=$ARTIFACT_ID"

  mutation-admission:
    name: mutation-admission
    needs: [mutation-plan, mutation-native-pilot-report]
    if: ${{ inputs.runtime_publish != true && !cancelled() && inputs.mutation_mode == 'production' && inputs.resume_run_id == '' && needs.mutation-plan.result == 'success' && needs.mutation-native-pilot-report.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: *mutation-runtime-image
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
      options: --cpus 2 --memory 6g
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify the pinned mutation runtime
        run: python3 -B .github/scripts/mutation_runtime.py verify --root .
      - name: Require separate external native review and admission
        id: execute
        env:
          GH_TOKEN: ${{ github.token }}
          MUTATION_JOB_NAME: mutation-admission
          PLAN_ARTIFACT_ID: ${{ needs.mutation-plan.outputs.plan_id }}
          MUTATION_CHAIN: ${{ needs.mutation-plan.outputs.chain }}
          NATIVE_REPORT_ARTIFACT_ID: ${{ needs.mutation-native-pilot-report.outputs.artifact_id }}
        run: python3 -B .github/scripts/mutation_workflow.py native-admission --scope production
      - name: Upload native admission verdict
        id: upload
        if: always() && steps.execute.outputs.native_name != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.execute.outputs.native_name }}
          path: ${{ runner.temp }}/mutation-job/native/
          if-no-files-found: error
          retention-days: 30
      - name: Bind native upload to producer log
        if: always() && steps.upload.outputs.artifact-id != ''
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: echo "MUTATION_ARTIFACT_ID=$ARTIFACT_ID"

  mutation-prepare:
    name: ${{ inputs.mutation_mode == 'fixture' && 'mutation-fixture-prepare' || 'mutation-prepare' }}
    needs: [mutation-plan, mutation-admission]
    if: >-
      inputs.runtime_publish != true && inputs.mutation_mode != 'plan' &&
      always() && !cancelled() && needs.mutation-plan.result == 'success' &&
      (inputs.mutation_mode == 'fixture' || needs.mutation-admission.result == 'success' || inputs.resume_run_id != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: *mutation-runtime-image
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
      options: --cpus 2 --memory 6g
    concurrency:
      group: ci-mutation-shard-0
      cancel-in-progress: false
      queue: max
    outputs:
      prepared_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify the pinned mutation runtime
        run: python3 -B .github/scripts/mutation_runtime.py verify --root .
      - name: Authenticate incremental history for this attempt
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          MUTATION_JOB_NAME: ${{ inputs.mutation_mode == 'fixture' && 'mutation-fixture-prepare' || 'mutation-prepare' }}
          MUTATION_SCOPE: ${{ inputs.mutation_mode == 'fixture' && 'fixture' || 'production' }}
          PLAN_ARTIFACT_ID: ${{ needs.mutation-plan.outputs.plan_id }}
          MUTATION_CHAIN: ${{ needs.mutation-plan.outputs.chain }}
          NATIVE_ADMISSION_ARTIFACT_ID: ${{ needs.mutation-admission.outputs.artifact_id }}
        run: python3 -B .github/scripts/mutation_workflow.py prepare --scope "$MUTATION_SCOPE"
      - name: Upload immutable current preparation
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare.outputs.artifact_name }}
          path: ${{ runner.temp }}/mutation-job/prepared/
          if-no-files-found: error
          retention-days: 30
      - name: Bind preparation upload to producer log
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: echo "MUTATION_ARTIFACT_ID=$ARTIFACT_ID"

  mutants:
    name: ${{ inputs.mutation_mode == 'fixture' && 'mutation-fixture-slot-' || 'mutation-slot-' }}${{ matrix.shard }}
    needs: mutation-prepare
    if: ${{ inputs.runtime_publish != true && inputs.mutation_mode != 'plan' && !cancelled() && needs.mutation-prepare.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: *mutation-runtime-image
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
      options: --cpus 2 --memory 6g
    concurrency:
      group: ci-mutation-shard-${{ matrix.shard }}
      cancel-in-progress: false
      queue: max
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - name: Verify the pinned mutation runtime
        run: python3 -B .github/scripts/mutation_runtime.py verify --root .
      - name: Execute bounded slot from authenticated original plan
        id: execute
        env:
          GH_TOKEN: ${{ github.token }}
          MUTATION_JOB_NAME: ${{ inputs.mutation_mode == 'fixture' && 'mutation-fixture-slot-' || 'mutation-slot-' }}${{ matrix.shard }}
          MUTATION_SCOPE: ${{ inputs.mutation_mode == 'fixture' && 'fixture' || 'production' }}
          PREPARED_ARTIFACT_ID: ${{ needs.mutation-prepare.outputs.prepared_id }}
          MUTATION_SLOT: ${{ matrix.shard }}
        run: python3 -B .github/scripts/mutation_workflow.py slot --scope "$MUTATION_SCOPE" --slot "$MUTATION_SLOT"
      - name: Retain completed evidence even when unfinished work fails
        id: upload
        if: always() && steps.execute.outputs.artifact_name != '' && steps.execute.outputs.bundle_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.execute.outputs.artifact_name }}
          path: ${{ runner.temp }}/mutation-job/result/
          if-no-files-found: error
          retention-days: 30
      - name: Bind delta upload to producer log
        if: always() && steps.upload.outputs.artifact-id != ''
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: echo "MUTATION_ARTIFACT_ID=$ARTIFACT_ID"

  mutation-aggregate:
    name: ${{ inputs.mutation_mode == 'fixture' && 'mutation-fixture-aggregate' || 'mutation-production-aggregate' }}
    needs: [mutation-plan, mutation-admission, mutation-prepare, mutants]
    if: >-
      inputs.runtime_publish != true && inputs.mutation_mode != 'plan' &&
      always() && !cancelled() && needs.mutation-plan.result == 'success' &&
      (inputs.mutation_mode == 'fixture' || needs.mutation-admission.result == 'success' || inputs.resume_run_id != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: *mutation-runtime-image
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
      options: --cpus 2 --memory 6g
    steps:
      - uses: actions/checkout@v4
      - name: Verify the pinned mutation runtime
        run: python3 -B .github/scripts/mutation_runtime.py verify --root .
      - name: Validate current inputs and exact complete evidence
        id: aggregate
        env:
          GH_TOKEN: ${{ github.token }}
          MUTATION_JOB_NAME: ${{ inputs.mutation_mode == 'fixture' && 'mutation-fixture-aggregate' || 'mutation-production-aggregate' }}
          MUTATION_SCOPE: ${{ inputs.mutation_mode == 'fixture' && 'fixture' || 'production' }}
          PLAN_ARTIFACT_ID: ${{ needs.mutation-plan.outputs.plan_id }}
          MUTATION_CHAIN: ${{ needs.mutation-plan.outputs.chain }}
          NATIVE_ADMISSION_ARTIFACT_ID: ${{ needs.mutation-admission.outputs.artifact_id }}
        run: python3 -B .github/scripts/mutation_workflow.py aggregate --scope "$MUTATION_SCOPE"
      - name: Upload immutable aggregate recovery snapshot
        id: snapshot
        if: always() && steps.aggregate.outputs.snapshot_name != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.aggregate.outputs.snapshot_name }}
          path: ${{ runner.temp }}/mutation-job/snapshot/
          if-no-files-found: error
          retention-days: 30
      - name: Bind snapshot upload to producer log
        if: always() && steps.snapshot.outputs.artifact-id != ''
        env:
          ARTIFACT_ID: ${{ steps.snapshot.outputs.artifact-id }}
        run: echo "MUTATION_ARTIFACT_ID=$ARTIFACT_ID"
      - name: Retain aggregate and continuation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-${{ inputs.mutation_mode == 'fixture' && 'fixture-' || 'production-' }}aggregate-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mutation-job/aggregate.json
            ${{ runner.temp }}/mutation-job/status.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish fixture recovery qualification
        id: qualification
        if: steps.aggregate.outputs.qualified == 'true' && success()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-fixture-qualification-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mutation-job/qualification/
          if-no-files-found: error
          retention-days: 30
      - name: Bind qualification upload to producer log
        if: steps.qualification.outputs.artifact-id != ''
        env:
          ARTIFACT_ID: ${{ steps.qualification.outputs.artifact-id }}
        run: echo "MUTATION_ARTIFACT_ID=$ARTIFACT_ID"
