name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml is the single source for the channel,
      # components and targets, and rustup installs from it on first
      # use. Naming any of them here too would create a second copy that
      # nothing keeps in sync.
      - name: Install the pinned toolchain
        run: rustup show
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      # Mechanically enforces [D1]: terri-core, terri-data and terri-sim
      # never depend on a web crate. terri-data is in the list from the
      # commit that created it, because a purity rule that a crate has to
      # be remembered into is one nobody remembers.
      # Explicit targets are load-bearing, not tidiness.
      # Cargo.lock records unactivated optional dependencies, and under
      # --target all there is a real-looking but inert path:
      #   terri-core -> bevy_ecs -> bevy_reflect -> bevy_reflect_derive
      #     -> uuid -> js-sys -> wasm-bindgen
      # bevy_reflect_derive is a proc-macro, so it always builds for the
      # host, where uuid's cfg(target_arch = "wasm32") block is inactive.
      # Nothing links into terri-core on any real target. Checking the two
      # targets that actually get built is both correct and meaningful; a
      # check that fails spuriously trains everyone to ignore it. See
      # lessons-learned [L4].
      #
      # The tree is captured before it is grepped, on purpose. A pipeline
      # used directly as an `if` condition is exempt from errexit, and
      # `pipefail` does not help because grep's no-match exit 1 is the
      # rightmost status anyway - so `if cargo tree | grep` reports "no
      # web crates found" when cargo itself fails. A renamed crate, a
      # crate moved out of the workspace, a bad target triple, or a
      # registry hiccup would all make this check vacuously green.
      # Assigning to a variable puts the failure back under errexit.
      - name: Verify sim core has no web dependencies
        run: |
          set -eu
          for target in x86_64-unknown-linux-gnu wasm32-unknown-unknown; do
            for crate in terri-core terri-data terri-sim; do
              tree=$(cargo tree -p "$crate" --target "$target")
              if printf '%s\n' "$tree" | grep -E 'wasm-bindgen|web-sys|js-sys'; then
                echo "FAIL: $crate depends on a web crate for $target"
                exit 1
              fi
            done
          done

  # Mutation testing. A surviving mutant is behaviour nothing constrains.
  # Five separate tests in this project were permanently green while
  # protecting nothing, and prose rules failed to prevent the recurrence
  # three times, because the family does not look like itself. This is the
  # mechanical backstop. See docs/testing-protocol.md.
  #
  # The gate is "no NEW survivors", not "zero survivors". It runs a full
  # sweep and compares the survivor list against a committed baseline,
  # rather than using --in-diff to restrict mutants to changed lines.
  #
  # --in-diff was tried first and is the wrong tool here. It implements
  # "no new survivors" only by proxy, and that proxy breaks on the one PR
  # that introduces the whole codebase: the diff is everything, so the run
  # degenerates into a full sweep and fails on accepted debt. Diffing
  # against a checked-in baseline needs no special case, and it turns the
  # known survivors into reviewable data instead of a number in a doc that
  # nothing enforces.
  #
  # --test-workspace true is load-bearing, not tidiness. By default each
  # mutant is tested only against its own package's suite, so a mutation in
  # terri-core is judged by terri-core's tests alone. Most of terri-core's
  # behaviour is exercised through terri-sim, so the default produced 11
  # false survivors on the first run, including Path::next_step -> None,
  # which the real suite catches instantly.
  #
  # terri-wasm is swept too, and is the package where a survivor costs the
  # most. Its exports are the untrusted-input boundary, so behaviour that
  # nothing constrains there is behaviour JavaScript is the first to find.
  # Its tests run on the host like any other, so this needs no wasm target.
  # It was omitted until #4, which left `SimHandle::tick` free to be a
  # no-op behind a green suite.
  # SHARDED, and the sharding is survival rather than speed. The M2b house
  # grew the sweep from ~250 mutants to ~650, the single job's wall time
  # grew past an hour, and GitHub's hosted runners killed it three times in
  # a row mid-sweep with "The runner has received a shutdown signal" - at
  # 35, 36 and 72 minutes, so it is capacity reclaim rather than a limit a
  # timeout setting could dodge.
  #
  # EIGHT shards, not the four this started with, and the count is a
  # measurement rather than a preference. At four, shards 0, 1 and 3 ran
  # 6 to 9 minutes while shard 2 ran 24 and then 64 minutes and was
  # reclaimed both times: a shard's COST is lumpy even when its COUNT is
  # even, because a mutant in a widely-depended-on file forces a large
  # incremental rebuild while a mutant in a leaf test file costs a second,
  # and the deterministic hash happened to pile the expensive cluster into
  # one shard. Eight ways splits that cluster and keeps every shard inside
  # the window the runner reliably survives; a reclaimed shard costs an
  # eighth of the sweep to retry rather than all of it.
  #
  # cargo-mutants assigns mutants to shards by a deterministic hash, so the
  # union of the eight shards is exactly the full sweep and nothing is
  # tested twice.
  mutants:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show
      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked
      # cargo-mutants exits 2 whenever any mutant survives, so its exit
      # code cannot be the signal for a no-new-survivors gate. The
      # comparison in the next step is.
      # --build-timeout bounds the phase --timeout does not: --timeout caps
      # a mutant's TEST run, and both of shard 2's reclaimed attempts died
      # in phase=Build, where nothing bounded a compile at all. Ten minutes
      # is far above any legitimate incremental rebuild here and far below
      # the reclaim horizon, so a pathological build costs ten minutes and
      # a named Timeout instead of the whole job.
      - name: Mutation sweep (shard ${{ matrix.shard }} of 8)
        run: |
          cargo mutants --package terri-core --package terri-sim \
            --package terri-data --package terri-wasm \
            --test-workspace true --timeout 60 --build-timeout 600 \
            --shard ${{ matrix.shard }}/8 || true
      # Per shard, "no new survivors" composes: each shard's missed set
      # must be a subset of the baseline, and a union of subsets is a
      # subset, so four green shards mean exactly what one green full
      # sweep meant.
      #
      # What does NOT compose is the old "these baseline entries are now
      # caught" nudge, and it is deliberately gone rather than kept per
      # shard: a baseline entry absent from this shard's missed list is
      # usually just a mutant HASHED INTO ANOTHER SHARD, so the nudge
      # would nag about entries that are alive and well. Finding genuinely
      # stale entries takes a full local sweep; docs/mutation-baseline.md
      # says so too.
      - name: Fail on survivors not in the baseline
        run: |
          set -eu
          sort mutants.out/missed.txt > actual.txt
          sort docs/mutants-baseline.txt > baseline.txt

          new=$(comm -23 actual.txt baseline.txt)
          if [ -n "$new" ]; then
            echo "NEW surviving mutants, absent from docs/mutants-baseline.txt:"
            printf '%s\n' "$new"
            echo ""
            echo "Each is behaviour that nothing constrains. Either add a test"
            echo "that kills it, or - if it is genuinely an equivalent mutant -"
            echo "add it to the baseline with the argument written down in"
            echo "docs/mutation-baseline.md. Do not add it silently."
            exit 1
          fi

          echo "No new survivors in shard ${{ matrix.shard }} of 8."

      # The step above reads missed.txt, so it is blind to a mutant that
      # HANGS: a timeout is neither caught nor a survivor, it lands in
      # timeout.txt, and the gate never looks there. Three of them lived in
      # `SimRng::range` for the whole of M1c that way, costing 180s a run and
      # reporting nothing, while the sweep summary said "3 timeouts" and no
      # committed file said which.
      #
      # This gate is zero-tolerance rather than a second baseline, because
      # the set is empty and expected to stay so. A hang is always a weaker
      # signal than an assertion ([L15] rule 4), so the answer to a new one
      # is to bound the loop, never to widen an allowance - and a baseline
      # that can grow is an invitation to do the latter.
      #
      # The existence check is the load-bearing half. `[ -s missing_file ]`
      # is simply false, so without it a renamed or relocated output file
      # would make this step report success while checking nothing, which is
      # the same vacuous-green trap the cargo tree step above documents.
      - name: Fail on mutants that hang instead of failing
        run: |
          set -eu
          if [ ! -f mutants.out/timeout.txt ]; then
            echo "FAIL: mutants.out/timeout.txt does not exist."
            echo "cargo-mutants always writes it, so this means its output"
            echo "layout changed and this check is no longer looking at"
            echo "anything. Fix the path rather than deleting the step."
            exit 1
          fi

          if [ -s mutants.out/timeout.txt ]; then
            echo "Mutants that HANG rather than fail an assertion:"
            cat mutants.out/timeout.txt
            echo ""
            echo "Each burns the job timeout instead of printing an assertion,"
            echo "and the survivor gate above cannot see it: a timeout lands in"
            echo "timeout.txt, not missed.txt. Find the unbounded loop the"
            echo "mutant spins in and give it a bound that panics, the way"
            echo "SimRng::draw_below_bound and roll_wander_path do. Raising"
            echo "--timeout is not a fix."
            exit 1
          fi

          echo "No mutants timed out."
      - name: Upload mutants report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-out-shard-${{ matrix.shard }}
          path: mutants.out/

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show
      # Pinned. Unpinned, this action installs whatever wasm-pack is
      # latest, and its bundled wasm-opt then has to parse whatever the
      # current rustc emits. That skew broke the build once already:
      # "Fatal: error in parsing input" from wasm-opt, on a commit whose
      # Rust changes were a dead-code deletion. 0.15.0 is the version
      # verified working against rustc 1.94.1.
      #
      # Reproducibility is load-bearing in this repo rather than merely
      # tidy: the golden world-hash vectors assert that native and wasm32
      # agree bit for bit, and a floating toolchain would turn a genuine
      # determinism regression and a toolchain bump into the same red.
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'v0.15.0'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # web/src/wasm/ is gitignored build output, so a fresh clone has no
      # WASM package. It must be built before the web tests can import it.
      - name: Build WASM package
        run: wasm-pack build crates/terri-wasm --target web --out-dir ../../web/src/wasm
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Type check
        working-directory: web
        run: npm run typecheck
      - name: Test
        working-directory: web
        run: npm test
